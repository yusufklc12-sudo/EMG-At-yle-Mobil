<tr><td>Yoğun bakım güçsüzlüğü</td><td>Kritik hastalık miyopatisi: düşük ve <b>uzun süreli</b> BKAP, SNAP normal, doğrudan kas uyarısına yanıtsızlık. Kritik hastalık polinöropatisi: düşük SNAP ve BKAP</td></tr>
<tr><td>Periyodik paralizi</td><td>Uzun egzersiz testi: 5 dk egzersiz sonrası 40 dk içinde BKAP'ta &gt;%40 düşüş</td></tr>
<tr><td>Biyopsi yeri</td><td>Bulgu olan kasın karşı tarafındaki homolog kas</td></tr></table>
${TRY('needle:mupM','Miyopatik MUP\'u dinleyin')}`},

{id:'tuzak',p:'V',t:'Teknik hatalar, istatistik ve tuzaklar',lv:'İleri',h:()=>`
<p class="lead">EMG'de yanlış tanının en sık nedeni hastalık değil, teknik hatadır. Beklenmeyen bir bulgu görüldüğünde ilk soru "hasta mı, teknik mi?" olmalıdır.</p>
<h3>Sinir iletiminde kontrol listesi</h3>
<table class="dt"><tr><th>Hata</th><th>Sonuç</th><th>Çözüm</th></tr>
<tr><td>Soğuk ekstremite</td><td>Uzun latans, düşük hız, büyük amplitüd</td><td>El ≥32 °C, ayak ≥30 °C; ısıtın</td></tr>
<tr><td>Submaksimal uyarı</td><td>Düşük amplitüd, yalancı blok</td><td>Yanıt artmayana kadar akımı artırın, +%20–30</td></tr>
<tr><td>Aşırı uyarı</td><td>Komşu sinir uyarılır, sanal katot ile kısa latans</td><td>Akımı düşürün, şekli izleyin</td></tr>
<tr><td>G1 motor noktada değil</td><td>Başlangıçta pozitif sapma, düşük amplitüd</td><td>G1'i kaydırın</td></tr>
<tr><td>Mesafe ölçüm hatası</td><td>Yanlış hız (özellikle kısa segmentte)</td><td>Ulnar için dirsek fleksiyonda, sinir seyrini izleyerek ölçün</td></tr>
<tr><td>Antidromik SNAP'ta kas artefaktı</td><td>Yanlış latans ve amplitüd</td><td>Ortodromik kayıt, uyarıyı düşürme</td></tr>
<tr><td>Elektrotlar arası mesafe &lt;3 cm (duyu)</td><td>Düşük SNAP amplitüdü</td><td>3–4 cm</td></tr>
<tr><td>Ödem, obezite, kalın cilt</td><td>Düşük amplitüd, submaksimal uyarı</td><td>Uyarı süresini uzatın, iğne uyarı/kayıt</td></tr>
<tr><td>İnervasyon anomalisi</td><td>Yalancı blok, yüksek hız</td><td>Anomaliyi doğrulayan ek uyarı</td></tr></table>
<h3>İğne EMG'de kontrol listesi</h3>
<ul><li>Son plak dikeni ↔ fibrilasyon.</li>
<li>Tam gevşemeyen kasta istemli MUP ↔ fasikülasyon.</li>
<li>Uzaktaki bir MUP (yükselme zamanı uzun) ↔ miyopatik küçük MUP.</li>
<li>Ağrı ya da yetersiz efor ↔ azalmış rekrutman (ateşleme hızına bakın).</li>
<li>Normal kişide ayak kaslarında ve yaşlı paraspinallerde fibrilasyon.</li></ul>
<h3>Referans değerler ve istatistik</h3>
<p>Normal sınırlar sağlıklı bireylerin ortalama ±2–2,5 SS'si ya da 2,5–97,5 persentilleriyle tanımlanır. Bu, normal bir bireyde her ölçümün yaklaşık %2,5–5 olasılıkla "anormal" çıkabileceği demektir. 20–30 ölçüm yapılan bir incelemede en az bir değerin sınırda anormal çıkması şaşırtıcı değildir.</p>
<ul><li>Tek bir sınırda değere dayanarak tanı koymayın.</li>
<li>Bulgular bir örüntü oluşturmalı ve klinikle uyumlu olmalıdır.</li>
<li>Yaşa, boya ve ısıya uygun referans kullanın.</li>
<li>Karşı tarafla ve komşu sinirle karşılaştırma iç kontrol sağlar.</li></ul>
${BX('def','Yorumun sırası','1) Teknik geçerlilik (ısı, uyarı, elektrot). 2) Hangi değerler kesin anormal? 3) Örüntü: tek sinir, kök, pleksus, yaygın? 4) Patofizyoloji: aksonal, demiyelinizan, kavşak, miyopatik. 5) Zamanlama ve şiddet. 6) Klinik soruyla uyum.')}
${TRY('motor:tuzak','Tuzakları canlı deneyin')}`},

{id:'rapor',p:'V',t:'Rapor yazımı',lv:'İleri',h:()=>`
<p class="lead">Rapor, istemi yapan hekimin sorusunu net bir şekilde yanıtlamalıdır. Ham veriler, bulguların özeti ve yorum ayrı tutulmalıdır.</p>
<h3>Raporun bölümleri</h3>
<ol><li><b>Kimlik ve klinik soru:</b> Yaş, cinsiyet, kısa öykü, istem nedeni.</li>
<li><b>Teknik bilgi:</b> Ekstremite ısısı, kullanılan elektrot tipi, olağan dışı koşullar (ödem, işbirliği güçlüğü).</li>
<li><b>Sinir iletim tablosu:</b> Her sinir için latans, amplitüd, iletim hızı, F ve H; referans değerler ve anormallerin işaretlenmesi.</li>
<li><b>İğne EMG tablosu:</b> Her kas için giriş aktivitesi, fibrilasyon/PSW, fasikülasyon, diğer spontan aktivite, MUP süre/amplitüd/polifazi, rekrutman.</li>
<li><b>Bulguların özeti:</b> Nesnel, yorum içermeyen cümleler.</li>
<li><b>Yorum (sonuç):</b> Normal mi anormal mi; lokalizasyon; patofizyoloji (aksonal/demiyelinizan); şiddet; zamanlama (akut, aktif, kronik); klinik soruyla ilişkisi.</li>
<li><b>Sınırlar ve öneriler:</b> Testin yapılamayan kısımları, kontrol çalışmasının zamanı.</li></ol>
${BX('def','Örnek yorum: KTS','Sağ median sinirin bilek düzeyinde fokal, duyu ve motor lifleri etkileyen demiyelinizan nöropatisiyle uyumlu elektrofizyolojik bulgular (orta derecede karpal tünel sendromu). Akson kaybını gösteren bulgu saptanmadı. Polinöropati ya da servikal radikülopatiyi düşündüren bulgu yoktur.')}
${BX('def','Örnek yorum: L5 radikülopati','Sol L5 kök dağılımında (tibialis anterior, tibialis posterior, gluteus medius, L5 paraspinal) aktif denervasyon ve erken reinnervasyon bulguları; sol L5 radikülopatisiyle uyumludur, subakut evrede. Yüzeyel peroneal SNAP\'ın normal olması lezyonun DRG proksimalinde olduğunu destekler. Peroneal nöropati lehine bulgu yoktur.')}
<h3>Kaçınılacak ifadeler</h3>
<ul><li>"Klinik korelasyon önerilir" ile biten ama soruyu yanıtlamayan raporlar.</li>
<li>Ölçülmemiş bir şeye dair kesin hüküm ("radikülopati yoktur" yerine "radikülopati lehine elektrofizyolojik bulgu saptanmadı").</li>
<li>Tek bir sınırda değerden tanı.</li>
<li>Nöropati ile polinöropati, bloğu ile yavaşlama gibi terimlerin karıştırılması.</li></ul>`},

if(pd>0&&d>0){zoomBy(Math.max(.8,Math.min(1.25,pd/d)),(a[0]+b[0])/2,(a[1]+b[1])/2)}pd=d});
const up=e=>{P.delete(e.pointerId);if(P.size<2)pd=0};sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
addEventListener('pointercancel',()=>{drag=null});
/* ses: iOS'ta sessiz düğmesine takılmasın, uygulama arka plana geçince sustur */
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
document.addEventListener('visibilitychange',()=>{if(typeof AC==='undefined'||!AC)return;if(document.hidden){AC.suspend&&AC.suspend()}else if(soundOn){AC.resume&&AC.resume()}});
/* başlangıç: tüm bölümler kapalı */
SECS.forEach(s=>s.classList.remove('open'));stopLoop();
})();


/* ================= ARAMA: uygulama içi + dış arama motorları ================= */
(function(){
const q=$('q'),R=$('qres');if(!q||!R)return;
const TRM={'ı':'i','ş':'s','ğ':'g','ü':'u','ö':'o','ç':'c','â':'a','î':'i','û':'u'};
const norm=s=>{let o='';for(let i=0;i<s.length;i++){let c=s[i].toLocaleLowerCase('tr');if(c.length!==1)c=c[0];o+=TRM[c]||c}return o};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const SEL='h3,p,li,tr,.bx,figcaption';
let IX=null;
function build(){IX=[];const sv=seed,tmp=document.createElement('div');
DERS.forEach(c=>{tmp.innerHTML=c.h().replace(/<\/b>/g,'</b> ');let sub='';tmp.querySelectorAll(SEL).forEach((el,k)=>{if(el.tagName==='H3')sub=el.textContent;
if(el.closest('.bx')&&el!==el.closest('.bx'))return;const t=el.textContent.replace(/\s+/g,' ').replace(/ ([,.;:)])/g,'$1').trim();if(t.length<3)return;
IX.push({kind:'d',cid:c.id,k,title:c.t,sub:el.tagName==='H3'?'':sub,t,n:norm(c.t+' '+sub+' '+t),nt:norm(c.t),nb:norm(t),ns:norm(el.tagName==='H3'?t:sub)})})});
Object.keys(NP).forEach(k=>{const p=NP[k];if(!p.n||p.g==='hid')return;const t=[p.sum||'',...(p.i||[]).map(r=>r[0]+': '+r[1])].join(' · ');IX.push({kind:'n',key:k,title:'İğne EMG örneği · '+p.n,sub:'',t,n:norm(p.n+' '+t),nt:norm(p.n),nb:norm(t),ns:norm(p.n)})});
Object.keys(LP).forEach(k=>{const p=LP[k];const t=[p.sum||'',...(p.i||[]).map(r=>r[0]+': '+r[1])].join(' · ');IX.push({kind:'l',key:k,title:'F / H örneği · '+p.n,sub:'',t,n:norm(p.n+' '+t),nt:norm(p.n),nb:norm(t),ns:norm(p.n)})});
seed=sv}
function snip(t,terms){const n=norm(t);let at=-1;for(const w of terms){const i=n.indexOf(w);if(i>=0&&(at<0||i<at))at=i}
let a=Math.max(0,at-70),b=Math.min(t.length,(at<0?0:at)+150);if(a>0){const sp=t.lastIndexOf(' ',a+12);if(sp>a-20&&sp>0)a=sp+1}
const s=t.slice(a,b),sn=n.slice(a,b),mk=new Array(s.length).fill(0);
terms.forEach(w=>{let i=sn.indexOf(w);while(i>=0){for(let j=i;j<i+w.length;j++)mk[j]=1;i=sn.indexOf(w,i+w.length)}});
let h='',on=0;for(let i=0;i<s.length;i++){if(mk[i]&&!on){h+='<mark>';on=1}if(!mk[i]&&on){h+='</mark>';on=0}h+=esc(s[i])}if(on)h+='</mark>';
return(a>0?'…':'')+h+(b<t.length?'…':'')}
const ENG=[['Google','https://www.google.com/search?q='],['Yandex','https://yandex.com.tr/search/?text='],['Google Akademik','https://scholar.google.com/scholar?q='],['PubMed','https://pubmed.ncbi.nlm.nih.gov/?term=']];
let hits=[];
function run(){const v=q.value.trim();if(!v){R.hidden=true;R.innerHTML='';return}if(!IX)build();
const terms=norm(v).split(/\s+/).filter(w=>w.length>1);
hits=terms.length?IX.map(e=>{let sc=0;for(const w of terms){if(e.n.indexOf(w)<0)return null;sc+=(e.nb.includes(w)?3:0)+(e.ns.includes(w)?3:0)+(e.nt.includes(w)?2:0);if(new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(e.n))sc+=1}return sc+(e.kind!=='d'?1:0)?{e,sc:sc+(e.kind!=='d'?1:0)}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc):[];
const seen={},sc2={};hits=hits.filter(h=>{const id=h.e.kind+(h.e.cid||h.e.key)+(h.e.sub||''),c=h.e.kind+(h.e.cid||h.e.key);seen[id]=(seen[id]||0)+1;sc2[c]=(sc2[c]||0)+1;return seen[id]<=2&&sc2[c]<=4}).slice(0,30);
const eq=encodeURIComponent(v),off=navigator.onLine===false;
R.innerHTML=`<div class="qeng"><span>${off?'İnternete bağlanınca:':'Web\'de ara:'}</span>${ENG.map(([n,u])=>`<a href="${u}${eq}" target="_blank" rel="noopener noreferrer">${n}</a>`).join('')}</div>`+
(hits.length?`<div class="qh">Uygulamada ${hits.length} sonuç</div>`+hits.map((h,i)=>`<button class="qr" data-i="${i}"><b>${esc(h.e.title)}</b>${h.e.sub?`<small>${esc(h.e.sub)}</small>`:''}<span>${snip(h.e.t,terms)}</span></button>`).join(''):`<div class="qh">Uygulamada sonuç yok. Yukarıdaki arama motorlarını deneyin.</div>`);
R.hidden=false}
function go(h){R.hidden=true;q.blur();const e=h.e;
if(e.kind==='n'){goTab('needle',e.key);return}if(e.kind==='l'){goTab('late',e.key);return}
setMode('ders');requestAnimationFrame(()=>{const ch=document.getElementById('d-'+e.cid);if(!ch)return;ch.classList.remove('cl');const pt=ch.closest('.prt');if(pt)pt.classList.remove('cl');
const el=ch.querySelectorAll(SEL)[e.k]||ch;setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('qflash');setTimeout(()=>el.classList.remove('qflash'),2200)},60)})}
let to;q.addEventListener('input',()=>{clearTimeout(to);to=setTimeout(run,120)});
q.addEventListener('focus',()=>{if(q.value.trim())run()});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){R.hidden=true;q.blur()}if(e.key==='Enter'&&hits[0]){e.preventDefault();go(hits[0])}});
R.addEventListener('click',e=>{const b=e.target.closest('.qr');if(b)go(hits[+b.dataset.i])});
document.addEventListener('pointerdown',e=>{if(!R.hidden&&!e.target.closest('.srch'))R.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'&&!document.activeElement.isContentEditable){e.preventDefault();q.focus()}});
})();

let instEv=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('inst').hidden=false});
$('inst').onclick=async()=>{if(!instEv)return;instEv.prompt();await instEv.userChoice;instEv=null;$('inst').hidden=true};
window.addEventListener('appinstalled',()=>{$('inst').hidden=true});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
