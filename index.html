<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="İğne EMG, sinir iletim çalışmaları, F/H yanıtları ve konu anlatımı içeren mobil EMG öğrenme uygulaması.">
<meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16151d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EMG Atölyesi"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>EMG Atölyesi</title>
<style>
:root{--bg:#f3f1fb;--card:#fff;--tx:#1d1b29;--tx2:#55536a;--tx3:#8a879c;--b:#e4e1f2;--b2:#cdc9e2;--ac:#7F5AF0;
--scope:#0d1714;--grid:#17302a;--grid2:#24493f;--tr:#5df2b0;--tr2:#ffd166;--mk:#ff7a93;
--skin:#F7D9C4;--skinS:#D9A88A;--skinD:#EFC6AC;--nerve:#E9A21B;--uA:#7F5AF0;--uB:#12A39A;--tA:#ddd2fc;--tB:#c4ece6;--hot:#FF5A3C;
--cord:#f8dbe5;--cordS:#d98aa6;--mus:#fbe7e4;--musS:#e2aaa2;--den:#f6c3bd;--denS:#d9534f}
@media (prefers-color-scheme: dark){:root{--bg:#16151d;--card:#22212b;--tx:#f1effa;--tx2:#bdb9d2;--tx3:#8a879c;--b:#33313f;--b2:#4a475a;
--skin:#6b5243;--skinS:#93705b;--skinD:#7a5d4c;--tA:#3d3266;--tB:#1d4a44;--cord:#4a2a37;--cordS:#b8577e;--mus:#3e2a2a;--musS:#8a5048;--den:#5a2a28}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;background:linear-gradient(90deg,#7F5AF0,#12A39A 55%,#E8962E);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1.5px solid var(--b2);background:var(--card);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--c,var(--ac))}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--b);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;padding:5px 14px;font-weight:600;color:var(--tx2)}
.tabs button{white-space:nowrap}@media (max-width:600px){.tabs{flex-wrap:wrap;border-radius:14px}.tabs button{padding:5px 10px}}
.tabs button.act{background:var(--ac);color:#fff}
.audio{margin-left:auto;display:flex;align-items:center;gap:8px}
#snd{font-weight:600}
#snd.on{background:#12A39A;border-color:#12A39A;color:#fff}
input[type=range]{accent-color:var(--ac);vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px 18px}
.grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.grp>span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-right:2px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.chip.act{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}.chip.act i{background:#fff}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);gap:12px}
.grid.lcol{grid-template-columns:44px minmax(0,1fr)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;box-shadow:0 2px 10px rgba(60,40,120,.06);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px 6px 14px}
.ph h2{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph h2 small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--tx2);font-size:12px}
.pbtn{display:flex;gap:4px}
.pbtn button{padding:0 9px;height:24px;font-size:14px;border-color:var(--b);color:var(--tx2)}
.pb{padding:0 12px 12px;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.card.col{flex:none!important}
.card.col .pb{display:none}
.grid.lcol #pSrc .ph{flex-direction:column-reverse;justify-content:flex-end;height:100%;padding:8px 0}
.grid.lcol #pSrc h2{writing-mode:vertical-rl;transform:rotate(180deg);flex:none}
.grid.lcol #pSrc .pe{display:none}
#srcsvg{width:100%;flex:1;min-height:0;display:block}
.srcnote{font-size:13px;line-height:1.4;color:var(--tx2);border-left:3px solid var(--c,var(--ac));padding:2px 0 2px 10px}
.scopewrap{position:relative;flex:1;min-height:220px;background:var(--scope);border-radius:12px;overflow:hidden}
#sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.scale{position:absolute;right:10px;top:7px;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fe9c8;opacity:.85;pointer-events:none}
.sctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--tx2)}
.sctrl label{display:inline-flex;align-items:center;gap:6px}
.sctrl select{font:inherit;font-size:12.5px;padding:3px 6px;border-radius:8px;border:1.5px solid var(--b2);background:var(--card);color:var(--tx)}
.sctrl b{color:var(--tx);font-weight:600}
.sctrl .sep{flex:1}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#tbl table{width:100%;border-collapse:collapse;font-size:13px}
#tbl th,#tbl td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}
#tbl th:first-child,#tbl td:first-child{text-align:left}
#tbl th{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
#tbl td.bad{color:#d9363e;font-weight:700}
#tbl .nl{font-size:11.5px;color:var(--tx3);margin-top:4px}
#info{overflow:auto}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--c);color:#fff;align-self:flex-start}
.sum{font-size:15px;font-weight:700;line-height:1.4;border-left:4px solid var(--c);padding:2px 0 2px 12px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{border-radius:12px;padding:7px 11px;background:color-mix(in srgb,var(--c) 9%,transparent);font-size:14px;line-height:1.4}
.row b{display:block;color:var(--c);font-size:13px;font-weight:800;margin-bottom:1px}
.row.snd{background:color-mix(in srgb,#E8962E 14%,transparent)}.row.snd b{color:#c0731a}
/* şema */
.cord{fill:var(--cord);stroke:var(--cordS);stroke-width:1.2}
.t3{font-size:10.5px;fill:var(--tx3);font-weight:600}
.t2{font-size:11px;fill:var(--tx2);font-weight:600}
.lead{stroke:var(--tx3);stroke-width:.8;stroke-dasharray:2 2;fill:none}
.cell{stroke:#fff;stroke-width:1.5;transition:fill .06s}
.cellA{fill:var(--uA)}.cellB{fill:var(--uB)}
.myel{fill:none;stroke:color-mix(in srgb,var(--tx3) 22%,transparent);stroke-width:8;stroke-linecap:round;stroke-dasharray:15 3}
.ax{fill:none;stroke-width:2.6;stroke-linecap:round;transition:stroke .06s}
.axA{stroke:var(--uA)}.axB{stroke:var(--uB)}
.br{fill:none;stroke-width:1.4}
.mus{fill:var(--mus);stroke:var(--musS);stroke-width:1.2}
.fb{stroke-width:1;transition:fill .05s}
.fbA{fill:var(--tA);stroke:var(--uA)}.fbB{fill:var(--tB);stroke:var(--uB)}
.fbD{fill:var(--den);stroke:var(--denS)}
.fbL{fill:none;stroke:var(--tx3);stroke-dasharray:3 3}
.ep{fill:#5b4a7a}
.on.cell{fill:var(--hot)!important}.on.ax{stroke:var(--hot)!important}.on.fb{fill:var(--hot)!important}.on.ep{fill:var(--hot)!important}
.ndl{stroke:#8e96a0;stroke-width:3.4;stroke-linecap:round}
.ndl.on{stroke:var(--hot)}
.rec{fill:none;stroke:var(--tx3);stroke-width:1;stroke-dasharray:3 3}
.gen{fill:none;stroke:#E5193D;stroke-width:2}
.bad{fill:#E5193D;font-weight:800}
.arm{fill:var(--skin);stroke:var(--skinS);stroke-width:1.3}
.armD{fill:var(--skinD);stroke:none}
.nv{fill:none;stroke:var(--nerve);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.elec{fill:#1d1b29;stroke:#fff;stroke-width:1.2}
.gnd{fill:#2e9e5b;stroke:#fff;stroke-width:1.2}
.stim{fill:var(--card);stroke:var(--tx2);stroke-width:1.2}
.stim.on{fill:#fff3c4;stroke:#E8962E;stroke-width:2}
.cat{fill:#1d1b29}.ano{fill:#d9363e}
.pdot{fill:var(--hot)}
.zone{fill:#E5193D;fill-opacity:.16;stroke:#E5193D;stroke-dasharray:4 3}
dialog{width:96vw;max-width:96vw;height:94vh;max-height:94vh;border:0;border-radius:18px;padding:12px 18px 16px;background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(20,10,60,.35)}
dialog[open]{display:flex;flex-direction:column;gap:8px}
dialog::backdrop{background:rgba(20,16,40,.45);backdrop-filter:blur(2px)}
.dh{display:flex;align-items:flex-start;gap:12px}
.dh h2{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:6px 0 0;white-space:nowrap}
#dhx{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
#db{flex:1;min-height:0;display:flex;flex-direction:column}
#db .pb{padding:0}
#db .rows{grid-template-columns:repeat(3,1fr)}
#db .row{font-size:15.5px}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tools button{padding:3px 9px;font-size:12px}
.tools button.act{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.tools button.on{background:#12A39A;border-color:#12A39A;color:#fff}
.tools .sep{flex:1}
.g2e{fill:#8a8a99}
.note{font-size:12.5px;color:#a8541c;background:color-mix(in srgb,#E8962E 12%,transparent);border-radius:8px;padding:3px 9px;margin-top:3px}
.note.warn{color:#c22;background:color-mix(in srgb,#E5484D 12%,transparent)}
.casebox{display:flex;align-items:center;gap:8px}
.steps{font-size:12.5px;color:var(--tx2)}
#info h3{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:2px 0 4px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.form{display:flex;flex-direction:column;gap:5px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.form select,.form textarea{font:inherit;font-size:13px;padding:3px 6px;border-radius:8px;border:1.5px solid var(--b2);background:var(--card);color:var(--tx)}
.form select{width:62%}
.form .pri{align-self:flex-end}
.sumt{width:100%;border-collapse:collapse;font-size:12.5px}.sumt td{padding:3px 6px;border-bottom:1px solid var(--b);vertical-align:top}.sumt td:first-child{font-weight:600;white-space:nowrap}
.badt{color:#d9363e;font-weight:700}
.fbx{border:1.5px solid var(--b2);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.fbx .ok{color:#12865f;font-weight:600}.fbx .no{color:#d9363e;font-weight:600}
.exp ul{margin:2px 0 6px 18px;padding:0}.exp p{margin:2px 0 6px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.vlab{font-size:10px;font-weight:800;letter-spacing:.1em;fill:var(--tx3)}
.nvl{fill:none;stroke:#F2B630;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3;opacity:.55}
.nvl.on{stroke-width:2.4;stroke-dasharray:none;opacity:.95}
.mlab{font-size:9.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#5a2a20;stroke-width:2.5px}
.tgt{fill:none;stroke:#12A39A;stroke-width:1.6;stroke-dasharray:3 2}
.tgl{font-size:9px;font-weight:800;fill:#0d7d71;paint-order:stroke;stroke:#fff;stroke-width:2.5px}
.site circle{fill:#fff;fill-opacity:.7;stroke:var(--tx2);stroke-width:1.2;stroke-dasharray:2 2}
.site text{font-size:9px;font-weight:700;fill:var(--tx);paint-order:stroke;stroke:var(--card);stroke-width:2.5px}
.site.act circle{stroke:#E8962E;stroke-width:2;stroke-dasharray:none}
.elab{font-size:9.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#1d1b29;stroke-width:2.5px}
.drg{cursor:grab}.drg:active{cursor:grabbing}
body.prac #srcsvg{touch-action:none;cursor:default}
#srcsvg{cursor:zoom-in}#dlg #srcsvg{cursor:default}
.tray{touch-action:none;cursor:grab;border-style:dashed}
.tray.set{border-style:solid;border-color:#12A39A}
.tray.set::after{content:"✓";color:#12A39A;font-weight:800}
.tl{font-size:11.5px;color:var(--tx3);font-weight:600}
.qs{flex-basis:100%;font-size:12.5px;color:var(--tx2);min-height:0}.qs:empty{display:none}
.hint2{color:var(--tx3);font-size:12px}
.svgw{position:relative;flex:1;min-height:0;display:flex}
.svgw #srcsvg{flex:1;width:100%;height:100%}
.zc{position:absolute;right:2px;top:2px;display:flex;flex-direction:column;gap:3px}
.zc button{width:26px;height:26px;padding:0;justify-content:center;font-size:15px;font-weight:700;background:color-mix(in srgb,var(--card) 85%,transparent)}
.sc-wm{fill:#f6e6ea;stroke:#c98aa0;stroke-width:1.2}
.sc-gm{fill:#d9a3b5;stroke:#b0687f;stroke-width:.8}
.sc-sul{stroke:#c98aa0;stroke-width:1.2}
.sc-cc{fill:#fff;stroke:#b0687f;stroke-width:.6}
.sc-root{fill:none;stroke:#e3c48e;stroke-width:6;stroke-linecap:round;opacity:.9}
.sc-drg{fill:#f5d99a;stroke:#c99a3a;stroke-width:1}
.sc-l{font-size:7.5px;font-weight:700;fill:#7a4a5c;paint-order:stroke;stroke:#fff;stroke-width:2px}
.mf{stroke-width:.9}.mfA{fill:url(#mfg);stroke:var(--uA)}.mfB{fill:url(#mfg);stroke:var(--uB)}
.mfD{fill:#c99485;stroke:#d9534f;stroke-dasharray:3 2}.mfL{fill:#f3dc9a;stroke:#d8b860}
.ndhit{stroke:transparent;stroke-width:30;pointer-events:stroke}
.ndrag{cursor:grab}.ndrag:active{cursor:grabbing}
.hub{fill:#3f86d8;stroke:#1f5aa0;stroke-width:1}.hub2{fill:#6a7480}
.ndl{stroke:#9aa1a9;stroke-width:3}
@media (prefers-color-scheme: dark){.sc-wm{fill:#4a3540}.sc-gm{fill:#7a4a5c}.sc-l{fill:#f3d6df;stroke:#22212b}}
@media (max-width:899px){.svgw{height:52vh;flex:none}}

.more{display:none}
.lessmore{font-size:12px;color:var(--tx3);margin-top:2px}
body:not(.prac) #info{cursor:zoom-in}
#db #info{cursor:auto;max-width:1300px;margin:0 auto;width:100%;gap:12px;overflow:auto;padding:4px 6px 8px}
#db .lessmore{display:none}
#db .more{display:block;margin-top:8px}
#db .mcols{column-count:2;column-gap:34px}
#db .more section{break-inside:avoid;margin:0 0 18px}
#db .more h4{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin:0 0 7px;padding-bottom:5px;border-bottom:2px solid color-mix(in srgb,var(--c) 25%,transparent)}
#db .more p,#db .more li{font-size:16.5px;line-height:1.62;color:var(--tx)}
#db .more p{margin:0}#db .more ul{margin:0;padding-left:20px}#db .more li{margin:0 0 6px}#db .more li::marker{color:var(--c)}
.pearl{border-radius:14px;padding:12px 18px;background:color-mix(in srgb,#E8962E 13%,transparent);border-left:5px solid #E8962E;font-size:16.5px;line-height:1.55;margin:2px 0 12px}
.pearl b{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#c0731a;margin-bottom:3px}
.quiz{border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:14px;padding:12px 18px;font-size:16.5px;line-height:1.55;background:color-mix(in srgb,var(--c) 6%,transparent)}
.quiz summary{cursor:pointer;font-weight:600;list-style:none}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary span{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:999px;padding:2px 11px;margin-right:9px;vertical-align:2px}
.quiz summary::after{content:"  · cevap için tıklayın";color:var(--tx3);font-weight:500;font-size:14px}
.quiz[open] summary::after{content:""}
.quiz p{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--b2)}
#db .tag{font-size:14px;padding:6px 16px}
#db .sum{font-size:21px;line-height:1.45;padding:4px 0 4px 16px}
#db .rows{gap:10px}
#db .row{font-size:16.5px;line-height:1.55;padding:12px 16px}
#db .row b{font-size:13.5px;margin-bottom:3px}
#db .steps{font-size:15px}#db .sumt{font-size:15px}#db .form label{font-size:15px}
@media (max-width:900px){#db .mcols{column-count:1}#db .rows{grid-template-columns:1fr}}
tr.ref td{color:var(--tx2);font-style:italic;font-size:12px;background:color-mix(in srgb,var(--ac) 6%,transparent)}
tr.ref td:first-child{font-weight:700;font-style:normal;color:var(--ac)}
#db tr.ref td{font-size:14px}

#ders{display:none}
.srch{position:relative;flex:1 1 220px;max-width:380px;min-width:180px}
.srch input{width:100%;font:inherit;font-size:13.5px;padding:7px 12px 7px 34px;border-radius:999px;border:1.5px solid var(--b2);background:var(--card);color:var(--tx);outline:none}
.srch input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.srch .qi{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--tx3);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
#qres{position:absolute;top:calc(100% + 6px);right:0;width:min(560px,92vw);max-height:72vh;overflow:auto;background:var(--card);border:1px solid var(--b);border-radius:14px;box-shadow:0 18px 50px rgba(20,10,60,.22);z-index:60;padding:8px}
.qeng{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 4px 10px;border-bottom:1px solid var(--b);margin-bottom:6px}
.qeng span{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-right:2px}
.qeng a{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1.5px solid var(--b2);color:var(--tx);text-decoration:none}
.qeng a:hover{border-color:var(--ac);color:var(--ac)}
.qh{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);padding:6px 6px 4px}
.qr{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:8px 10px;background:none;font-size:13px;line-height:1.45}
.qr:hover,.qr:focus{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.qr b{display:block;font-size:13.5px;color:var(--tx)}.qr small{display:block;font-size:11.5px;color:var(--ac);font-weight:600;margin:1px 0}
.qr span{display:block;color:var(--tx2)}.qr mark,.qflash mark{background:color-mix(in srgb,#E8962E 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.qflash{animation:qf 2.2s ease}@keyframes qf{0%,40%{background:color-mix(in srgb,#E8962E 30%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.qflash{animation:none;outline:2px solid #E8962E}}
.tocp{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ac);padding:14px 10px 4px}
.dpart{max-width:820px;margin:0 auto;padding:44px 40px 0;font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--tx)}

<script>
const $=id=>document.getElementById(id);
const SR=44100;
const gs=(t,m,w)=>{const z=(t-m)/w;return Math.exp(-z*z)};
let seed=7;const rnd=()=>{if(!(seed>0&&seed<2147483647))seed=7;seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const nrm=()=>{let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd())};

/* ================= İĞNE EMG: dalga şekilleri (t: ms, değer: µV; negatif = yukarı) ================= */
const fibF=A=>t=>A*(.32*gs(t,.35,.2)-gs(t,.85,.22)+.48*gs(t,1.45,.45));
const pswF=A=>t=>A*((1-Math.exp(-t/.3))*Math.exp(-t/4)-.1*gs(t,14,5));
const epnF=A=>t=>-A*gs(t,.35,.16);
const epsF=A=>t=>A*(-gs(t,.7,.32)+.5*gs(t,1.6,.6));
const TPL={N:[[1.5,.7,.18],[3.2,.55,-1],[4.4,.75,.62],[6.3,1.4,-.12]],
R:[[1.5,.8,.15],[3.2,.6,-.55],[4.2,.5,.45],[5.3,.55,-1],[6.6,.7,.7],[8.4,.9,-.4],[10.6,1.2,.3],[13.5,1.8,-.12]],
M:[[.8,.25,.25],[1.4,.22,-1],[1.95,.22,.85],[2.5,.22,-.75],[3.05,.25,.55],[3.7,.3,-.3],[4.4,.35,.12]]};
function mupF(k,A,s=1,vary=0){const c=TPL[k].map(([m,w,a])=>[m*s,w*s,a*(1+vary*(rnd()-.5))]);return t=>{let v=0;for(const[m,w,a]of c)v+=a*gs(t,m,w);return A*v}}
const fib1=fibF(1);
const crdF=()=>{const o=[[0,.6],[1.2,1],[2,-.5],[3.1,.85],[4.3,.5],[5.6,.7],[6.4,.35]];return t=>{let v=0;for(const[d,a]of o){const s=t-d;if(s>-.5&&s<3)v+=320*a*fib1(s)}return v}};

function Buf(dur){const n=Math.round(dur*SR);return{dur,n,d:new Float32Array(n),ev:[],
add(t,f,ms,src){const s0=Math.round(t*SR),L=Math.ceil(ms*SR/1000),d=this.d,n=this.n;for(let i=0;i<L;i++){const k=((s0+i)%n+n)%n;d[k]+=f(i*1000/SR)}if(src)this.ev.push([((s0%n)+n)%n,src])}}}
function addNoise(B,rms){let a=0,b=0;for(let i=0;i<B.n;i++){a+=.45*(nrm()-a);b+=.02*(a-b);B.d[i]+=(a-b)*rms*1.6}}
function train(B,rate,ph,f,ms,src){for(let t=ph;t<B.dur-1e-6;t+=1/rate)B.add(t,f,ms,src)}
function insBurst(B,t0,dur,den,amp=1){const nn=Math.round(25+45*Math.min(amp,1.5));for(let k=0;k<nn;k++){const t=t0+dur*Math.pow(rnd(),1.6),A=(60+rnd()*380)*amp,y=rnd();
if(y<.45)B.add(t,fibF(A*(rnd()<.5?1:-1)),3,'ins');else if(y<.75)B.add(t,epsF(A*.8),4,'ins');else B.add(t,pswF(A*.6),15,'ins')}
if(den==='psw'||den===true)for(let t=t0+dur;t<t0+dur+1.4;t+=1/9)B.add(t,pswF(160*Math.min(amp,1.2)*(1-(t-t0-dur)/2)),22,'f4');if(den==='myo')myoEp(B,t0+dur,1.2)}
function myoEp(B,t0,T){let t=t0,i=0;while(t<t0+T){const x=(t-t0)/T,up=x<.12;const f=up?45+70*x/.12:115-90*Math.pow((x-.12)/.88,.85);const A=up?100+150*x/.12:250-190*(x-.12)/.88;B.add(t,pswF(A),18,i++%2?'f3':'f4');t+=1/f}}
const UN={};
function units(k){if(UN[k])return UN[k];if(!/^mup/.test(k))return[];seed=k.length*977+k.charCodeAt(3);const U=[];
if(k==='mupN')for(let i=0;i<14;i++)U.push({th:.03+.065*i,r0:6,k:42,rmax:30,f:mupF('N',380+i*85,.9+rnd()*.3,.5),len:13});
if(k==='mupR')[.03,.45,.8].forEach((th,i)=>U.push({th,r0:6,k:65,rmax:42,f:mupF('R',[2600,3400,4200][i],1.12+rnd()*.2,.6),len:26}));
if(k==='mupNR')[.03,.4,.75].forEach((th,i)=>U.push({th,r0:6,k:65,rmax:42,f:mupF('N',[700,900,1100][i],1,.4),len:13}));
if(k==='mupM')for(let i=0;i<24;i++)U.push({th:.01+.02*i,r0:6,k:45,rmax:28,f:mupF('M',140+rnd()*160,.85+rnd()*.35,.7),len:7});
return UN[k]=U}
function recruit(B,k,e){const U=units(k);let n=0,r1=0;U.forEach((u,i)=>{if(e<u.th)return;const r=Math.min(u.rmax,u.r0+u.k*(e-u.th));if(!n)r1=r;n++;
let t=rnd()/r;while(t<B.dur){B.add(t,u.f,u.len,'u'+i);t+=Math.max(.3,1+.1*nrm())/r}});return{n,r1}}

const NG=[['rest','İstirahat · normal','#12A39A'],['spon','Spontan · anormal','#E5484D'],['mup','İstemli · MUP','#7F5AF0']];
const NP={
ins:{g:'rest',n:'İnsersiyonel aktivite',tb:50,sens:100,dur:6,gen(B){},
src:'Kaynak: iğnenin kas liflerini mekanik olarak uyarması.',
sum:'İğne ilerletildiğinde ya da oynatıldığında kısa bir potansiyel kümesi çıkar; iğne durunca 300 ms içinde söner. Şemadaki iğneyi sürükleyerek deneyin: hızlı ve uzun hareket daha yoğun aktivite verir.',
i:[['Şekil','Keskin, karışık dikenler ve pozitif dalgalar; kısa süreli (<300 ms).'],['Ses','Kısa bir çıtırtı / hışırtı.',1],
['Artmış','İğne durduktan sonra da süren PSW veya fibrilasyon dizileri: erken denervasyon, miyotoni, enflamatuvar miyopati. "İğneyi oynat" ile deneyin.'],
['Azalmış','Kas fibrozla veya yağla yer değiştirmişse (ileri miyopati, uzun süreli denervasyon) ya da periyodik paralizi atağı sırasında.'],
['Teknik','Her bölgede iğne kısa adımlarla (~1 mm) ilerletilir, her adımdan sonra birkaç saniye beklenir.']]},
epn:{g:'rest',n:'Son plak gürültüsü',tb:10,sens:50,dur:4,gen(B){for(let t=0;t<B.dur;t+=-Math.log(1-rnd())/600)B.add(t,epnF(8+rnd()*28),1.2,rnd()<.05?'ep':null)},
src:'Kaynak: son plakta kendiliğinden salınan asetilkolin kuantumları (minyatür son plak potansiyelleri).',
sum:'İğne son plak bölgesine girince çok sık, küçük, monofazik negatif dalgalardan oluşan düzensiz bir zemin görülür.',
i:[['Şekil','10–50 µV, 0,5–1 ms, monofazik negatif; düzensiz ve çok sık.'],['Ses','Kulağa tutulan deniz kabuğu gibi sürekli hışırtı.',1],
['Klinik ipucu','Hasta iğne yerinde künt, derin bir ağrı hisseder. İğne biraz geri çekilince kaybolur.'],
['Anlam','Normaldir. Sık görüldüğü için fibrilasyonla karıştırmamak önemlidir.']]},
eps:{g:'rest',n:'Son plak dikenleri',tb:10,sens:100,dur:4,gen(B){for(let t=0;t<B.dur;t+=-Math.log(1-rnd())/350)B.add(t,epnF(8+rnd()*25),1.2);for(let t=.05;t<B.dur;t+=-Math.log(1-rnd())/22)B.add(t,epsF(90+rnd()*180),4,'eps')},
src:'Kaynak: iğnenin intramüsküler sinir terminalini uyarması; tek bir kas lifi ateşlenir.',
sum:'Son plak gürültüsünün üzerinde düzensiz ateşleyen, başlangıcı negatif, kısa dikenler.',
i:[['Şekil','100–200 µV, 3–4 ms, bifazik; başlangıç defleksiyonu negatif (yukarı).'],['Ses','Kızgın yağda cızırdama.',1],
['Ateşleme','Düzensiz, 5–50 Hz.'],['Fibrilasyondan ayırma','Fibrilasyonun ilk fazı pozitiftir ve ateşlemesi saat gibi düzenlidir. Son plak dikeninin ilk fazı negatif, ritmi düzensizdir.'],
['Anlam','Normaldir.']]},
fib:{g:'spon',n:'Fibrilasyon',tb:50,sens:50,dur:6,gen(B){train(B,3,.11,fibF(85),3,'f3');train(B,7.5,.05,fibF(55),3,'f4');train(B,11.5,.02,fibF(120),3,'f6')},
src:'Kaynak: aksonunu kaybetmiş (denerve) tek kas lifinin kendiliğinden ateşlemesi.',
sum:'Küçük, kısa, başlangıcı pozitif dikenler; her lif kendi sabit ritminde, saat gibi düzenli ateşler.',
i:[['Şekil','20–200 µV, 1–5 ms; bi- veya trifazik, ilk faz pozitif (aşağı).'],['Ses','Çatıya düşen yağmur damlaları / saatin tik-taklaması.',1],
['Ateşleme','Çok düzenli, 0,5–15 Hz. Ekranda 3 farklı lif, 3 farklı ritimde.'],['Derecelendirme','1+: en az iki bölgede kalıcı · 2+: birçok bölgede orta sayıda · 3+: her bölgede çok · 4+: ekranı dolduran.'],
['Zamanlama','Akson hasarından yaklaşık 2–3 hafta sonra belirir (lezyon kasa ne kadar yakınsa o kadar erken).'],
['Anlam','Aktif denervasyon (aksonal nöropati, radikülopati, motor nöron hastalığı). Ayrıca nekrotizan/enflamatuvar miyopati ve distrofilerde.']]},
psw:{g:'spon',n:'Pozitif keskin dalga',tb:50,sens:100,dur:6,gen(B){train(B,4.5,.07,pswF(170),25,'f3');train(B,8.5,.03,pswF(110),25,'f4')},
src:'Kaynak: denerve kas lifi; aksiyon potansiyeli iğne ucunda bloke olur.',
sum:'Keskin bir pozitif (aşağı) sapma ve ardından yavaş bir dönüş. Fibrilasyonla aynı anlamı taşır.',
i:[['Şekil','Keskin pozitif başlangıç, yavaş negatif dönüş; 20–200 µV, 10–30 ms.'],['Ses','Künt, boğuk "pop".',1],
['Ateşleme','Düzenli, 0,5–15 Hz.'],['Anlam','Fibrilasyonla birlikte aktif denervasyon. Denervasyonda fibrilasyondan biraz önce çıkabilir; miyotonide de görülür.']]},
fasc:{g:'spon',n:'Fasikülasyon',tb:200,sens:500,dur:8,gen(B){[.7,2.9,3.35,5.6,7.1].forEach((t,i)=>B.add(t,mupF('N',i%2?950:1350,1.1),13,'uA'))},
src:'Kaynak: tek bir motor ünitenin istemsiz ateşlemesi (ön boynuz hücresi ya da aksonun herhangi bir noktası).',
sum:'Kas tam gevşekken arada bir, düzensiz aralıklarla tek bir motor ünite potansiyeli çıkar.',
i:[['Şekil','MUP şeklinde (normal ya da nörojenik).'],['Ses','Ara ara patlayan mısır / kalın, tok "pop".',1],
['Ateşleme','Düzensiz ve çok yavaş (çoğu zaman <1 Hz). Gönüllü MUP\'tan ayırt etmek için kas tam gevşek olmalı.'],
['Anlam','Tek başına benign olabilir. Fibrilasyon, PSW ve nörojenik MUP ile birlikteyse ALS gibi ön boynuz hastalığını düşündürür. Ayrıca radikülopati, polinöropati, tirotoksikoz, kramp-fasikülasyon sendromu.']]},
myot:{g:'spon',n:'Miyotonik deşarj',tb:100,sens:100,dur:6,gen(B){myoEp(B,.3,2.4);myoEp(B,3.4,2.2)},
src:'Kaynak: kas lifi membranının instabilitesi (çoğu zaman Cl⁻ veya Na⁺ kanalı bozukluğu).',
sum:'Tek lif potansiyelleri yüksek frekansta ateşler; frekans ve amplitüd önce artar sonra azalır.',
i:[['Şekil','Fibrilasyon ya da PSW biçiminde tek lif potansiyelleri.'],['Ses','Pike yapan uçak ("dive bomber") ya da hızlanıp yavaşlayan motosiklet.',1],
['Ateşleme','20–150 Hz; dalgalanan (waxing–waning) frekans ve amplitüd.'],
['Anlam','Miyotonik distrofi tip 1–2, miyotonia konjenita (CLCN1), paramiyotonia konjenita (SCN4A). Klinik miyotoni olmadan: Pompe hastalığı, hipotiroidi, bazı ilaçlar.']]},
crd:{g:'spon',n:'Kompleks tekrarlayıcı deşarj',tb:10,sens:200,dur:5,gen(B){const f=crdF();for(let t=.4;t<4.3;t+=1/42)B.add(t,f,9,'crd')},
src:'Kaynak: bir kas lifi komşu lifleri efaptik olarak uyarır ve döngü kendini sürdürür.',
sum:'Çok fazlı, karmaşık bir potansiyel her seferinde birebir aynı şekilde, sabit hızda tekrarlar; ani başlar, ani biter.',
i:[['Şekil','Çok fazlı ve karmaşık; tekrarlar arasında şekil değişmez.'],['Ses','Rölantide çalışan makine / motor.',1],
['Ateşleme','5–100 Hz, çok düzenli; frekans değişmeden aniden durur.'],
['Anlam','Kronikliği gösterir, özgül değildir: kronik nörojenik süreçler (radikülopati, SMA, kronik nöropati) veya kronik miyopatiler (inklüzyon cisimcikli miyozit, polimiyozit, distrofiler).']]},
myok:{g:'spon',n:'Miyokimi',tb:100,sens:500,dur:6,gen(B){let t=.2;while(t<5.5){const k=3+Math.floor(rnd()*3);for(let j=0;j<k;j++)B.add(t+j/45,mupF('N',900),11,'uA');t+=.75+rnd()*.25}},
src:'Kaynak: motor aksonun hipereksitabilitesi; demiyelinize segmentte ektopik ateşleme.',
sum:'Aynı motor ünite gruplar (burst) halinde ateşler; burstler yarı ritmik olarak tekrar eder.',
i:[['Şekil','Burst içinde 2–10 kez tekrarlayan aynı MUP.'],['Ses','Uygun adım yürüyen askerler.',1],
['Ateşleme','Burst içinde ~40–60 Hz; burstler 0,1–10 Hz arayla.'],
['Anlam','Ekstremitede: radyasyon pleksopatisi (tümör infiltrasyonundan ayırmada önemli), GBS, Isaacs sendromu. Yüzde: MS, beyin sapı tümörü.']]},
nmy:{g:'spon',n:'Nöromiyotoni',tb:50,sens:500,dur:5,gen(B){[.3,2.8].forEach(t0=>{let t=t0;while(t<t0+.7){const x=(t-t0)/.7;B.add(t,mupF('N',700*(1-.65*x),.55),6,'uA');t+=1/(220-50*x)}})},
src:'Kaynak: periferik motor aksonun belirgin hipereksitabilitesi (çoğu zaman CASPR2/VGKC kompleks antikorları).',
sum:'Tek bir MUP çok yüksek frekansta tekrarlar; amplitüdü deşarj boyunca giderek azalır.',
i:[['Şekil','Azalan (dekremental) amplitüdlü tekrarlayan MUP.'],['Ses','Yüksek perdeli "ping" / çınlama.',1],
['Ateşleme','150–250 Hz.'],['Anlam','Isaacs sendromu (edinsel nöromiyotoni), Morvan sendromu, kramp-fasikülasyon sendromu. Uykuda ve genel anestezide sürer.']]},
mupN:{g:'mup',n:'Normal MUP',tb:10,sens:500,dur:4,eff:12,
src:'Kaynak: tek bir motor nöron ve innerve ettiği kas liflerinin toplam potansiyeli.',
sum:'Kasılma gücü arttıkça önce ateşleme hızı artar, sonra yeni üniteler katılır; maksimal kasılmada bazal hat tamamen kapanır.',
i:[['Şekil','Amplitüd ~0,5–2 mV, süre 5–15 ms, 2–4 faz (polifazi <%15).'],['Ses','Net, keskin, "tok" vuruşlar; güç arttıkça yoğun gürültü.',1],
['Rekrutman','İlk ünite ~5–10 Hz ile başlar; ikinci ünite ilk ünite ~10 Hz\'e ulaşınca katılır (rekrutman oranı <5).'],
['Deneyin','"Kasılma gücü" kaydırıcısını %10 → %100 arasında oynatın; tek ünite → tam interferans paterni.']]},
mupR:{g:'mup',n:'Nörojenik MUP',tb:10,sens:1000,dur:4,eff:30,
src:'Kaynak: reinnervasyon. Sağ kalan aksonlar filizlenip denerve lifleri sahiplenir; ünite büyür.',
sum:'Az sayıda, büyük, uzun süreli ve polifazik ünite; bir sonraki ünite katılmadan önce ilki çok hızlı ateşler (azalmış rekrutman).',
i:[['Şekil','Yüksek amplitüd (>4–5 mV olabilir), uzun süre (>15 ms), polifazik. Erken reinnervasyonda şekli değişen (instabil) MUP.'],
['Ses','Kalın, gümbürtülü; tek ünitenin hızlı ateşlemesi makineli tüfek gibi.',1],

const sig=(x,th,k)=>1/(1+Math.exp(-(x-th)/k));
function fSweeps(o,n=10){const out=[],reps=o.rep?[o.fMin+.4,o.fMin+1.7]:null,sg=o.sg||1;
for(let i=0;i<n;i++){const has=rnd()<o.p;let fl=0,fa=0,ds=1;
if(has){if(reps&&rnd()<.65){const r=rnd()<.5?0:1;fl=reps[r];fa=r?240:170;ds=r?.8:.62}else{fl=o.fMin+rnd()*o.disp;fa=60+rnd()*260;ds=.55+rnd()*.5}}
const M=cmapF(o.mLat,o.mAmp*1000,1),mf=has?mupF('N',fa*.75,ds*1.1):null,F=has?t=>t<fl-.5?0:mf(t-fl+.5):()=>0,nz=noiseArr(o.nz||7);
out.push({f:t=>sg*(M(t)+F(t))+nz[Math.min(nz.length-1,Math.round(t*100))],has,fl,lab:'#'+(i+1)})}return out}
function fStats(sw,mLat){const L=sw.filter(s=>s.has).map(s=>s.fl);return{mLat,n:L.length,N:sw.length,min:L.length?Math.min(...L):null,max:L.length?Math.max(...L):null,mean:L.length?L.reduce((a,b)=>a+b,0)/L.length:null}}
function hTrace(o,I){const th=o.th||0,fm=o.off?0:sig(I,20+th,2),fh=o.off?0:sig(I,9+th,1.6)*Math.pow(1-fm,2)*(o.ok===false?.35:1),s=o.sg||1;
const M=cmapF(o.mLat,o.mMax*fm,1.1),Hh=cmapF(o.hLat,o.hMax*fh,1.25),nz=noiseArr(o.nz||.02),ar=t=>(I/40)*(.8*gs(t,.08,.06)-.3*gs(t,.3,.2));
return{f:t=>s*(M(t)+Hh(t))+ar(t)+nz[Math.min(nz.length-1,Math.round(t*100))],m:o.mMax*fm,h:o.hMax*fh,hLat:o.hLat,I,lab:I+' mA'}}
function hStats(tr){let hm=0,hl=null,mm=0;tr.forEach(t=>{if(t.h>hm){hm=t.h;hl=t.hLat}if(t.m>mm)mm=t.m});return{hm,hl:hm>.08?hl:null,mm,ratio:mm>.2&&hm>.08?hm/mm:null}}

function atS(G,s){for(const g of G.seg)if(s<=g.s0+g.L||g===G.seg[G.seg.length-1]){if(g.jump)return null;const k=Math.max(0,Math.min(1,(s-g.s0)/g.L));return[g.a[0]+(g.b[0]-g.a[0])*k,g.a[1]+(g.b[1]-g.a[1])*k]}}
function animAlong(G,s0,s1,t0,dur,col){const lo=Math.min(s0,s1),hi=Math.max(s0,s1),tot=Math.max(hi-lo,1),pieces=[];
for(const g of G.seg){const a=Math.max(lo,g.s0),b=Math.min(hi,g.s0+g.L);if(b<=a)continue;
if(g.jump){pieces.push({jump:1,len:b-a});continue}const pa=atS(G,a+1e-6)||g.a,pb=atS(G,b-1e-6)||g.b,last=pieces[pieces.length-1];
if(last&&!last.jump){last.pts.push(pb);last.len+=b-a}else pieces.push({pts:[pa,pb],len:b-a})}
if(s0>s1){pieces.reverse();pieces.forEach(p=>p.pts&&p.pts.reverse())}
let t=t0;for(const p of pieces){const d=dur*p.len/tot;if(p.pts)anims.push({P:p.pts,t0:t,d:Math.max(d,30),col});t+=d}return t}

const DET={
/* ---- iğne EMG ---- */
'n:ins':{pf:`İğne ucu ilerlerken kas lifi membranlarını mekanik olarak zedeler ve depolarize eder; zedelenme akımı kısa süreli bir potansiyel kümesi doğurur. Sağlıklı kasta bu aktivite iğne durunca birkaç yüz milisaniye içinde biter. Membranı dengesiz (denerve, miyotonik, enflamasyonlu) liflerde aynı mekanik uyarı daha uzun ve tekrarlayan deşarjlara yol açar.`,
how:[`Her kas için en az dört kadranda, her kadranda 4–5 farklı derinlikte örnekleme yapın.`,`Her adım ~1 mm olsun; adımdan sonra 1–2 saniye bekleyip spontan aktivite olup olmadığına bakın.`,`Ekran: 50–100 µV/div, 10–20 ms/div. Ses, ekrandan önce uyarır.`],
pit:[`Son plak bölgesindeki hareket son plak gürültüsü ve dikenleriyle karışır; hasta derin bir ağrı hisseder.`,`İğne ucu yağ dokusundaysa aktivite yoktur; "azalmış giriş aktivitesi" sanılabilir.`,`Bazı sağlıklı kişilerde (özellikle baldır kaslarında) kısa PSW dizileri normal varyant olarak görülebilir.`],
ddx:`Artmış: erken denervasyon, miyotoni, enflamatuvar/nekrotizan miyopati. Azalmış: kasın fibroz ve yağla yer değiştirmesi (ileri distrofi, uzun süreli denervasyon), periyodik paralizi atağı, ödem.`,
pearl:`Uzamış giriş aktivitesi tek başına denervasyon demek değildir; iğne sabitken de süren (kalıcı) fibrilasyon veya PSW aranmalıdır.`,
q:[`İğne hareketinden sonra 2 saniye süren düzenli bir PSW dizisi görülüyor, iğne sabitken kayboluyor. Yorumun?`,`Artmış giriş aktivitesi. Erken veya hafif denervasyon olabilir ama kalıcı spontan aktivite değildir. İğneyi sabit tutup bekleyin, başka bölgelere bakın ve klinikle birlikte değerlendirin.`]},
'n:epn':{pf:`Motor sinir terminalinden kendiliğinden salınan tek tek asetilkolin kuantumları postsinaptik membranda minyatür son plak potansiyelleri (MEPP) oluşturur. Bunlar aksiyon potansiyeli değildir ve yayılmaz; ancak iğne ucu son plağa çok yakınsa ekstraselüler olarak kaydedilir.`,
how:[`Bazal hat düzensizce "kalkar"; çok sık, küçük, monofazik negatif dalgalar görülür.`,`Ses deniz kabuğunu kulağa tutunca duyulan hışırtıya benzer.`,`Son plak bölgesi çoğu kasta kas karnının ortasındadır.`],
pit:[`Fibrilasyonla karıştırılabilir: fibrilasyon bi/trifaziktir, ilk fazı pozitiftir ve saat gibi düzenli ateşler.`],
pearl:`Hasta iğne yerinde derin, künt ağrı tarif ediyorsa son plaktasınız. İğneyi biraz geri çekip yönünü değiştirin.`,
q:[`Hasta derin ağrı tarif ediyor; ekranda düzensiz, küçük negatif dalgalar ve deniz kabuğu sesi var. Ne yaparsın?`,`Son plak bölgesindesin; bu normal bir bulgudur. İğneyi geri çekip yönünü değiştir ve anormal aktivite olarak raporlama.`]},
'n:eps':{pf:`İğne, kas içindeki ince sinir terminalini irrite eder; terminalde doğan aksiyon potansiyeli tek bir kas lifine yayılır. Kayıt elektrodu lifin depolarize olan bölgesine yakın olduğu için ilk faz negatiftir.`,
how:[`Son plak gürültüsünün üzerinde düzensiz ateşleyen kısa dikenler görülür.`,`Ateşleme 5–50 Hz, düzensizdir; ses kızgın yağda cızırdamaya benzer.`],
pit:[`İğne ucu lifin uyarıldığı noktadan uzaksa son plak dikeni de ilk fazı pozitif görünebilir. Bu durumda asıl ayırıcı düzensiz ritim, eşlik eden son plak gürültüsü ve hastanın ağrısıdır.`],
ddx:`Fibrilasyon: düzenli ritim, ilk faz pozitif, ağrı yok, son plak gürültüsü eşlik etmez.`,
pearl:`Ritme bakın: fibrilasyon "saat", son plak dikeni "cızırtı".`,
q:[`Düzensiz ateşleyen, ilk fazı pozitif küçük dikenler var; arka planda deniz kabuğu sesi duyuluyor. Fibrilasyon mu?`,`Büyük olasılıkla son plak dikeni: ritim düzensiz ve son plak gürültüsü eşlik ediyor. İğneyi çekip başka bir yerde tekrar bak.`]},
'n:fib':{pf:`Aksonunu kaybeden kas lifinde asetilkolin reseptörleri tüm membrana yayılır ve membran potansiyeli dengesizleşir. Kendiliğinden oluşan osilasyonlar eşiğe ulaştıkça lif tek başına ateşler. Tek bir lifin potansiyeli olduğu için küçük ve kısadır.`,
how:[`Kas tamamen gevşek olmalı; duyarlılık 50 µV/div.`,`Ritmin düzenliliğini görmek için birkaç saniye dinleyin; ses yağmur damlası ya da saat tiklemesine benzer.`,`Yalnızca iğne ucunun hemen yakınındaki lifler kaydedilir; şemada iğneyi denerve liflerden uzaklaştırınca sinyal söner.`],
pit:[`Lezyondan sonraki ilk günlerde fibrilasyon yoktur. Lezyona yakın kaslarda (ör. paraspinal) ~10–14 günde, uzak distal kaslarda 3–6 haftada belirir.`,`Ayak intrinsik kaslarında sağlıklı kişilerde de görülebilir; tek başına yorumlanmaz.`,`Soğuk kasta fibrilasyonlar azalır.`],
ddx:`Son plak dikeni (düzensiz, ilk faz negatif), PSW (aynı anlam, farklı şekil), gevşeyemeyen hastada küçük istemli MUP'lar.`,
pearl:`Fibrilasyon "aktif" denervasyonu gösterir: reinnervasyon tamamlanınca azalır, kas fibroza dönünce kaybolur.`,
q:[`Ulnar sinir kesisinden 5 gün sonra birinci dorsal interosseöz kasında fibrilasyon yok. Denervasyon olmadığını mı gösterir?`,`Hayır. Fibrilasyon için henüz erken; distal kaslarda 3–6 hafta gerekebilir. Bu dönemde azalmış rekrutman ve sinir iletimi daha bilgilendiricidir.`]},
'n:psw':{pf:`İğne ucu lif membranını zedeleyip o noktayı depolarize eder. Lif boyunca gelen aksiyon potansiyeli iğne ucunda bloke olur; kayıtta keskin bir pozitif sapma ve onu izleyen uzun, yavaş bir dönüş görülür.`,
how:[`İlk sapma keskin ve aşağıya doğrudur (pozitif); dönüş yavaştır.`,`Ritim fibrilasyon gibi düzenlidir; ses künt, boğuk bir "pop"tur.`],
pit:[`Yalnızca iğne hareketinden sonra çıkıp hemen sönen kısa PSW dizileri kalıcı spontan aktivite sayılmaz.`],
ddx:`Fibrilasyonla aynı anlamı taşır; miyotonik deşarjların bir kısmı da PSW şeklindedir (frekansın inip çıkması ayırır).`,
pearl:`Denervasyonda PSW'ler fibrilasyondan birkaç gün önce görülebilir.`,
q:[`PSW'ler yalnız iğne hareketinden hemen sonra kısa süre çıkıyor, iğne sabitken kayboluyor. Yorumun?`,`Artmış giriş aktivitesi; kalıcı spontan aktivite değil. Erken veya hafif denervasyon olabilir; diğer kaslar ve klinikle birlikte değerlendir.`]},
'n:fasc':{pf:`Tek bir motor ünitenin istemsiz, kendiliğinden ateşlemesidir. Kaynak ön boynuz hücresi olabileceği gibi aksonun herhangi bir yeri de olabilir; çoğunun distal akson terminallerinden kaynaklandığı düşünülür.`,
how:[`Kas tam gevşek olmalı; iğneyi sabit tutup en az 60–90 saniye izleyin. Fasikülasyon seyrek ateşler.`,`Sesle ekrandan daha kolay fark edilir: ara ara gelen tok "pop".`],
pit:[`Hasta tam gevşemezse istemli MUP'lar fasikülasyon sanılabilir. İstemli ünite düzenli 5–10 Hz ile başlar ve kas gevşeyince susar.`],
ddx:`Benign fasikülasyon: başka anormallik yok, MUP şekli normal. ALS: fasikülasyon kompleks ve instabil, nörojenik MUP ve denervasyonla birlikte; Awaji kriterlerinde bu durumda fibrilasyon yerine geçer.`,
pearl:`Fasikülasyon tek başına tanı koydurmaz; eşlik eden bulgulara bakın.`,
q:[`Gönüllü bir MUP'u fasikülasyondan nasıl ayırırsın?`,`İstemli ünite hasta kasınca düzenli ~5–10 Hz ile başlar ve gevşeyince susar. Fasikülasyon düzensiz, çok seyrek ateşler ve hastanın kontrolünde değildir.`]},
'n:myot':{pf:`Kas lifi membranında klorür iletkenliği azalır (CLCN1) ya da Na⁺ kanalının inaktivasyonu bozulur (SCN4A). Tekrarlayan aksiyon potansiyelleriyle T-tübüllerde potasyum birikir, membran yeniden depolarize olur ve lif kendini tekrar tekrar ateşler.`,
how:[`İğne hareketiyle kolayca tetiklenir; şemada iğneyi oynatınca deşarj başlar.`,`Frekans ve amplitüd önce artar sonra azalır (20–150 Hz); ses pike yapan uçak ya da hızlanıp yavaşlayan motosiklettir.`],
pit:[`DM2'de miyotoni proksimal ve sinsi olabilir; birçok kas taranmazsa kaçırılır.`,`Klinik miyotoni olmadan da görülebilir (Pompe, hipotiroidi, bazı ilaçlar).`],
ddx:`Kompleks tekrarlayıcı deşarj: frekans sabittir, ani başlar ve ani biter. Nöromiyotoni: MUP şeklinde potansiyeller, çok yüksek frekans (150–250 Hz).`,
pearl:`Klorür kanalı miyotonisi tekrarlayan hareketle azalır ("ısınma"); paramiyotonide tersine artar ve soğukla kötüleşir. Bu fark kısa egzersiz ve soğutma testleriyle gösterilir.`,
q:[`Ses "pike yapan uçak" gibi; potansiyeller tek lif boyutunda ve frekansı dalgalanıyor. Bu ne?`,`Miyotonik deşarj. Frekansın ve amplitüdün dalgalanması onu kompleks tekrarlayıcı deşarjdan ayırır.`]},
'n:crd':{pf:`Bir "pacemaker" lifin deşarjı komşu lifleri efaptik olarak uyarır. Döngüdeki bir lif tekrar pacemaker'ı uyarınca döngü kendini sürdürür. Bir lif bloke olduğunda döngü aniden durur.`,
how:[`Her tekrarda birebir aynı çok fazlı şekil, sabit frekans (5–100 Hz).`,`Ani başlar ve ani biter; ses rölantideki makine gibidir.`],
pit:[`Frekansta ani bir basamak değişikliği, döngüye bir lifin katıldığını ya da ayrıldığını gösterir; yine CRD'dir.`],
ddx:`Miyotoni (frekans ve amplitüd değişken), miyokimi (MUP'tan oluşan burstler), nöromiyotoni (çok yüksek frekans, azalan amplitüd).`,
pearl:`CRD özgül değildir; sürecin kronik olduğunu söyler (kronik radikülopati, SMA, kronik miyopatiler).`,
q:[`CRD'yi miyotoniden en kolay hangi özellikle ayırırsın?`,`Frekansın sabit olmasıyla ve deşarjın ani başlayıp ani bitmesiyle. Miyotonide frekans ve amplitüd inip çıkar.`]},
'n:myok':{pf:`Hasarlı veya demiyelinize motor akson segmenti hipereksitabl hale gelir ve kendiliğinden, gruplar halinde ateşler. Aynı motor ünite kısa burstler halinde tekrarlar.`,
how:[`Aynı MUP'un 2–10'luk gruplar halinde tekrarlaması; burstler yarı ritmik.`,`Ses uygun adım yürüyen askerleri andırır; klinikte cilt altında "solucan gibi" kıpırdanma görülebilir.`],
ddx:`Fasikülasyon (tek tek ateşleme), nöromiyotoni (çok yüksek frekanslı ve uzun deşarj), CRD (sabit şekil, kas lifi kaynaklı).`,
pearl:`Meme veya akciğer kanseri öyküsünde pleksopatide miyokimi radyasyon hasarını destekler; tümör infiltrasyonunda nadirdir.`,
q:[`Meme kanseri için aksiller radyoterapi alan hastada el güçsüzlüğü var; iğne EMG'de miyokimi görülüyor. Hangi tanı lehine?`,`Radyasyon pleksopatisi. Miyokimi tümör infiltrasyonunda nadir görülür.`]},
'n:nmy':{pf:`Distal motor aksonda voltaj kapılı potasyum kanallarının işlevi azalır (sıklıkla CASPR2 / VGKC kompleks antikorları). Repolarizasyon uzar ve akson çok yüksek frekansta tekrarlayan deşarjlar üretir.`,
how:[`Tek bir MUP'un 150–250 Hz'de tekrarlaması; amplitüd giderek azalır.`,`Ses yüksek perdeli bir "ping"tir. Sinir iletim çalışmasında motor yanıtın ardından "afterdischarge" görülebilir.`],
ddx:`Miyotoni (tek lif potansiyelleri), CRD (sabit, daha düşük frekans), miyokimi (daha düşük frekanslı burstler).`,
pearl:`Kaynak çoğunlukla distal olduğu için periferik sinir bloğu deşarjı her zaman durdurmaz; uykuda ve genel anestezide sürer.`,
q:[`Kramp, kas sertliği ve aşırı terleme olan bir hastada 200 Hz civarında azalan amplitüdlü tekrarlayıcı MUP deşarjları görülüyor. Hangi antikoru araştırırsın?`,`CASPR2 (VGKC kompleks) antikorlarını; Isaacs sendromu düşünülür. Timoma da araştırılmalıdır.`]},
'n:mupN':{pf:`Motor ünite potansiyeli, tek bir motor nöronun innerve ettiği ve iğnenin kayıt alanına giren liflerin toplam potansiyelidir. Amplitüdü daha çok iğneye en yakın birkaç liften, süresi ise ünitedeki lif sayısı ve dağılımından gelir.`,
how:[`Amplitüd: tepeden tepeye; iğneye yakınlığa çok duyarlıdır. Keskin (yakın) bir MUP için yükselme zamanı <0,5 ms olmalıdır.`,`Süre: ünite büyüklüğünün en iyi göstergesi; kas ve yaşa göre normal değerler farklıdır.`,`Faz sayısı: bazal hattı geçiş sayısı + 1; >4 faz polifazik sayılır.`,`Rekrutman oranı = en hızlı ünitenin ateşleme hızı ÷ aktif ünite sayısı; normalde <5.`],
pit:[`Uzak MUP'lar küçük ve küt görünür; iğneyi yükselme zamanı keskinleşene kadar hafifçe oynatın (şemada iğneyi liflere yaklaştırın).`],
pearl:`Rekrutman, MUP şeklinden önce bozulur: akut nörojenik lezyonda MUP normal ama rekrutman azalmıştır.`,
q:[`Hafif kasılmada tek bir ünite 18 Hz'de ateşliyor ve ikinci ünite hâlâ katılmamış. Yorumun?`,`Rekrutman oranı yüksek (azalmış rekrutman): nörojenik süreç. Normalde ikinci ünite ilk ünite ~10 Hz'deyken katılır.`]},
'n:mupR':{pf:`Akson kaybında kalan aksonlar filizlenip denerve lifleri sahiplenir (kollateral reinnervasyon). Ünite başına lif sayısı ve ünitenin alanı artar; MUP büyür ve uzar.`,
how:[`Erken reinnervasyon: uzun, çok fazlı, düşük amplitüdlü ve instabil (şekli taramadan taramaya değişen) MUP'lar.`,`Kronik dönem: yüksek amplitüdlü, uzun süreli, stabil MUP'lar.`,`Azalmış rekrutman: az sayıda ünite 20–40 Hz'e kadar hızlı ateşler.`],
pit:[`Yüksek amplitüd tek başına yanıltıcı olabilir; iğne ünitenin liflerine çok yakınsa normal ünite de büyük görünür. Süre ve rekrutman daha güvenilirdir.`],
ddx:`Kronik miyopatide (ör. inklüzyon cisimcikli miyozit) uzun süreli MUP'lar küçük miyopatik MUP'larla karışık görülebilir.`,
pearl:`MUP'un instabil olması reinnervasyonun devam ettiğini, stabil büyük MUP'lar ise sürecin eski olduğunu gösterir.`,
q:[`Lezyondan 2 gün sonra MUP'lar normal şekilde ama rekrutman azalmış. Bu ne gösterir?`,`Akut nörojenik lezyon (akson kaybı veya ileti bloğu). Reinnervasyon henüz başlamadığı için MUP şekli normaldir.`]},
'n:mupM':{pf:`Miyopatide motor ünitedeki işlevsel kas lifi sayısı azalır ve lifler arası iletim farklılaşır. MUP küçülür, kısalır ve çok fazlı olur. Aynı kuvveti üretmek için daha çok ünite gerekir.`,
how:[`Kısa süreli (<5–6 ms), düşük amplitüdlü, polifazik MUP'lar.`,`Erken rekrutman: hafif kasılmada bile çok sayıda ünite; amplitüdü düşük bir tam interferans paterni.`,`Ses çıtırtılı, "statik" radyo gürültüsü gibidir.`],
pit:[`Steroid miyopatisinde iğne EMG normal olabilir.`,`Nöromüsküler kavşak hastalığında da benzer küçük, instabil MUP'lar görülebilir.`],
ddx:`Kronik miyopatide uzun süreli MUP'larla karışık patern; kesin ayrım için kantitatif MUP analizi.`,
pearl:`Miyopatide fibrilasyon varsa nekrotizan veya enflamatuvar süreç düşünülür.`,
q:[`Hafif kasılmada ekran küçük ve çok fazlı ünitelerle doluyor, hasta ise güçsüz. Rekrutman nasıl adlandırılır?`,`Erken rekrutman: miyopatik patern.`]},
/* ---- motor iletim ---- */
'm:normal':{pf:`Bileşik kas aksiyon potansiyeli (BKAP), uyarılan tüm motor aksonların innerve ettiği kas liflerinin toplam yanıtıdır. Latans en hızlı aksonların iletimini, amplitüd ve alan uyarılan akson ve kas lifi sayısını, süre ise iletimin ne kadar eş zamanlı olduğunu yansıtır.`,
how:[`G1 kasın motor noktasına konur; doğru yerdeyse BKAP'ın ilk sapması negatiftir (yukarı).`,`G2 tendona ya da kemik çıkıntıya; toprak elektrodu uyarıcı ile G1 arasına.`,`Akım, amplitüd artmayana kadar yükseltilir, sonra ~%20 daha (supramaksimal).`,`Mesafe uyarıcının katodundan ölçülür; ekstremite ısısı kontrol edilir.`],
pit:[`İlk sapması pozitif BKAP: G1 motor noktada değil ya da bir anastomoz var.`,`Uyarı artefaktı büyükse anodu katodun etrafında döndürün ve cildi temizleyin.`,`Kısa segmentlerde küçük ölçüm hataları iletim hızını büyük ölçüde değiştirir.`],
pearl:`Amplitüd akson sayısını, hız ve latans miyelini anlatır. Önce amplitüde, sonra latans ve hıza bakın.`,
q:[`BKAP'ın ilk sapması pozitif. İlk düşüncen ne olmalı?`,`G1 motor noktada değil: elektrodu yeniden yerleştir. Düzelmezse bir anastomozu (ör. Martin–Gruber) düşün.`]},
'm:akson':{pf:`Akson kaybında daha az akson, daha az kas lifini uyarır ve BKAP küçülür. Kalan aksonların miyelini sağlam olduğu için hız korunur; en hızlı lifler kaybolduysa hafif yavaşlama olur.`,
how:[`Distal ve proksimal uyarıda amplitüd benzer oranda düşüktür (fokal düşüş yok).`,`İH genelde alt sınırın %75'inin üzerinde, distal latans üst sınırın %130'unun altındadır.`,`İğne EMG'de denervasyon ve reinnervasyon bulguları beklenir.`],
pit:[`Akut lezyonun ilk günlerinde distal segment hâlâ iletir: lezyon distalinden uyarıda BKAP normal, proksimalinden düşük çıkar ve ileti bloğunu taklit eder. BKAP ~3–5. günde düşmeye başlar, ~9. günde dibe ulaşır.`],
ddx:`Ön boynuz hastalığı (SNAP normal), aksonal polinöropati (SNAP düşük, uzunluğa bağımlı), pleksopati (SNAP düşük, dağılım segmental), radikülopati (SNAP normal).`,
pearl:`Belirgin akson kaybında hız da biraz düşer; bu, demiyelinizasyon demek değildir. "Demiyelinizan aralık" için yavaşlamanın orantısız olması gerekir.`,
q:[`Peroneal ayak düşmesinin 2. günü: fibula başı altından BKAP normal, üstünden düşük. Akson kaybı mı, blok mu?`,`Henüz ayırt edilemez. Wallerian dejenerasyon tamamlanmadan akson kaybı da blok gibi görünür; çalışmayı ~10. günde tekrarla.`]},
'm:demy':{pf:`Miyelin hasarında saltatorik ileti bozulur: düğümler arası ileti yavaşlar ya da tamamen durur. Farklı aksonlar farklı derecede yavaşladığı için yanıtlar zamana yayılır (temporal dispersiyon) ve fazlar birbirini kısmen siler.`,
how:[`Distal latans belirgin uzun, İH çok düşük; proksimal BKAP geniş ve basık.`,`BKAP süresinin proksimalde >%30 artması anormal dispersiyon lehinedir.`,`F latansları uzar ya da F yanıtları kaybolur.`],
pit:[`Amplitüd çok düşükse en hızlı lifler kaybolmuş olabilir; bu durumda demiyelinizasyon için daha belirgin yavaşlama gerekir.`],
ddx:`CMT1 (düzgün ve yaygın yavaşlama, dispersiyon az, aile öyküsü), KİDP ve GBS (yamalı yavaşlama, blok, dispersiyon), anti-MAG nöropati (distal latansta orantısız uzama), POEMS.`,
pearl:`Kalıtsal demiyelinizan nöropatide tüm sinirler aynı derecede yavaştır. Edinsel formda sinirler ve segmentler arası farklılık (yamalı tutulum) belirgindir.`,
q:[`Tüm sinirlerde İH ~22 m/s ve birbirine çok yakın; ileti bloğu yok. İlk düşünce?`,`Kalıtsal demiyelinizan nöropati (CMT1). Düzgün (uniform) yavaşlama edinsel değil kalıtsal formu düşündürür.`]},
'm:blok':{pf:`Bloke segmentte aksiyon potansiyeli düğümler arasında geçemez. Bloğun distalinden verilen uyarı normal yanıt oluşturur, proksimalinden verilen uyarı ise yalnızca bloke olmayan aksonlardan yanıt alır.`,
how:[`Proksimal amplitüd ya da alan distalin yarısından azsa ve süre belirgin uzamadıysa blok düşünülür.`,`Eşikler kritere göre değişir (EAN/PNS, AAEM); kesin ve olası blok ayrı tanımlanır.`,`Bloğun yerini kısa segment (inching) çalışmasıyla santimetre düzeyinde bulabilirsiniz.`],
pit:[`Proksimal uyarı submaksimal kalabilir (derin sinir, kalın doku).`,`Martin–Gruber anastomozu: ulnar çalışmada önkolda yalancı blok yapar; median çalışmada dirsekten uyarıda BKAP bilekten büyük ve ilk sapması pozitif olur.`,`Aksesuar derin peroneal sinir: peroneal çalışmada dizden alınan yanıt ayak bileğinden büyük çıkar; lateral malleolün arkasından uyararak gösterilir.`],
ddx:`Multifokal motor nöropati (yalnız motor, anti-GM1), KİDP, akut bası, erken akson kaybı (yalancı blok).`,
pearl:`Blok varsa kas güçsüzdür ama atrofisi azdır. Blok düzelince güç hızla geri gelir.`,
q:[`Ulnar motor çalışmada bilekten 10 mV, dirsek altından 6 mV alınıyor. Median çalışmada dirsek yanıtı bilekten büyük ve ilk sapması pozitif. Yorum?`,`Büyük olasılıkla Martin–Gruber anastomozu; önkolda gerçek bir ileti bloğu değil.`]},
'mt:medM':{pf:`Transvers karpal ligament altında median sinire bası, önce paranodal miyelini bozar: bilek segmentinde fokal yavaşlama olur. İlerledikçe akson kaybı eklenir.`,
how:[`Hafif: yalnız duyu karşılaştırmaları anormal. Orta: duyu ve motor distal latans uzamış. İleri: BKAP veya SNAP amplitüdü düşük ya da alınamıyor, abductor pollicis brevis'te denervasyon.`,`Median–ulnar karşılaştırmaları: D4 halka, palmar mikst, lumbrikal–interosseöz.`],
pit:[`Martin–Gruber anastomozuyla birlikte KTS'de dirsek uyarısında başlangıçta pozitif sapma olur ve önkol hızı yalancı biçimde hızlı hesaplanır.`,`Polinöropati varsa median bulgusunu diğer sinirlerle karşılaştırmadan KTS denemez.`],
ddx:`C6–C7 radikülopati (SNAP normal), proksimal median nöropati (pronator; önkol kasları ve palmar kutanöz alan tutulur), polinöropati.`,
pearl:`Palmar kutanöz dal karpal tünelin üstünden geçer; KTS'de avuç içi duyusu korunur.`,
q:[`Elde uyuşma var ama median distal motor latans normal. KTS'yi dışlar mı?`,`Hayır. Hafif KTS'de motor çalışma normal olabilir; duyu iletimi ve median–ulnar karşılaştırmalarına bak.`]},
'mt:ulnM':{pf:`Ulnar sinir dirsekte iki yerde sıkışabilir: medial epikondil arkasındaki retrokondiler olukta ve fleksör karpi ulnaris aponörozu altındaki kubital tünelde. Dirsek fleksiyonu siniri gerer ve tüneli daraltır.`,
how:[`Dirsek ~70–90° bükülü çalışılır; dirsek segmenti ≥10 cm olmalı.`,`Anormal kabul: dirsek segmentinde İH <50 m/s, ya da önkoldan >10 m/s yavaş, ya da dirsekte belirgin amplitüd düşüşü.`,`Birinci dorsal interosseözden kayıt ve inching duyarlılığı artırır.`],
pit:[`Dirsek ekstansiyonda ölçülürse mesafe kısa ölçülür ve dirsek segmenti yalancı yavaş çıkar.`,`Martin–Gruber anastomozu önkolda yalancı blok yapar.`],
ddx:`Guyon kanalında ulnar nöropati (dorsal ulnar kutanöz SNAP normal), C8 radikülopati (SNAP normal, paraspinal tutulum), alt trunkus/medial kord pleksopatisi (medial antebrakiyal kutanöz SNAP düşük).`,
pearl:`Dorsal ulnar kutanöz dal bileğin proksimalinden ayrılır: dirsek lezyonunda düşük, Guyon lezyonunda normaldir.`,
q:[`Ulnar SNAP normal, abductor digiti minimi ve birinci dorsal interosseöz kaslarında denervasyon, paraspinallerde fibrilasyon var. Lezyon nerede?`,`C8 kökünde: SNAP normal (preganglionik), paraspinal tutulum var.`]},
'mt:perM':{pf:`Peroneal sinir fibula başının etrafında yüzeyel seyreder ve kemiğe dayanır; bacak bacak üstüne atma, kilo kaybı, uzun çömelme, alçı ya da ameliyat pozisyonu siniri bu noktada sıkıştırır.`,
how:[`Fibula başı altı ve popliteal fossa arasında fokal yavaşlama ve/veya blok aranır.`,`Ekstansör digitorum brevis atrofikse tibialis anteriordan kayıt alın; blok daha iyi görünür.`,`Yüzeyel peroneal SNAP de değerlendirilir.`],
pit:[`Aksesuar derin peroneal sinir, dizden alınan yanıtın ayak bileğinden büyük çıkmasına yol açar.`],
ddx:`L5 radikülopati (tibialis posterior ve gluteus medius da tutulur, yüzeyel peroneal SNAP normal), siyatik nöropati (biceps femoris kısa başı tutulur), lumbosakral pleksopati.`,
pearl:`Biceps femoris kısa başı peroneal liflerle innerve edilen ve diz üstündeki tek kastır; tutulumu lezyonun siyatik düzeyinde olduğunu gösterir.`,
q:[`Ayak düşmesinde tibialis posterior güçsüz ve paraspinallerde fibrilasyon var. Peroneal nöropati mi?`,`Hayır. Tibialis posterior tibial sinirden innerve edilir; bu dağılım L5 radikülopatisini düşündürür.`]},
'mt:tibM':{pf:`Tibial sinir medial malleol arkasında, fleksör retinakulum altındaki tarsal tünelden geçer ve medial ile lateral plantar sinirlere ayrılır. Bası nedenleri arasında ganglion, varis, travma sonrası değişiklikler ve tenosinovit vardır.`,
how:[`Abductor hallucis (medial plantar) ve abductor digiti quinti pedis (lateral plantar) distal latansları karşılaştırılır.`,`Medial ve lateral plantar mikst veya duyu yanıtları daha duyarlıdır.`],
pit:[`Yaşlı ve ödemli ayakta plantar yanıtlar normalde de alınamayabilir; mutlaka karşı tarafla karşılaştırın.`],
ddx:`Polinöropati (iki taraflı, uzunluğa bağımlı), S1 radikülopatisi, plantar fasiit.`,
pearl:`Tarsal tünel sendromu sık konan ama nadir doğrulanan bir tanıdır; tek taraflı anormallik ve karşı tarafın normal olması gerekir.`,
q:[`İki taraflı simetrik plantar yanıt kaybı ve sural SNAP düşüklüğü var. Tarsal tünel mi?`,`Hayır. İki taraflı, uzunluğa bağımlı tutulum polinöropatiyi düşündürür.`]},
/* ---- duyu iletim ---- */
's:normal':{pf:`SNAP, uyarılan duyusal aksonların toplam aksiyon potansiyelidir. Sinaps ya da kas aracı olmadığı için mikrovolt düzeyindedir ve doğrudan aksonların sayısını ve iletimini yansıtır.`,
how:[`Başlangıç latansı iletim hızı hesabında, tepe latansı ise karşılaştırmalarda (en tekrarlanabilir ölçüm) kullanılır.`,`Amplitüd tepe–tepe ya da bazal–tepe ölçülür; laboratuvarın yöntemine uyulmalıdır.`,`G1–G2 arası 3–4 cm olmalı; daha kısa olursa amplitüd düşer.`],
pit:[`Gürültü küçük SNAP'ı gizler: ortalama alın, kası gevşetin, toprak elektrodunu doğru koyun.`,`Uyarı artefaktı başlangıç latansını gizleyebilir.`,`Soğuk ekstremitede latans uzar, amplitüd artar.`],
pearl:`SNAP düşükse lezyon dorsal kök gangliyonunda ya da distalindedir; normalse ya lezyon yoktur ya da gangliyonun proksimalindedir.`,
q:[`Elde belirgin duyu kaybı olduğu halde SNAP normal. Lezyon nerede olabilir?`,`DRG'nin proksimalinde: kök veya spinal kord (preganglionik). Ya da duyu kaybı organik değildir.`]},
's:akson':{pf:`Duyusal akson kaybı ya da DRG hücre gövdesinin kaybı SNAP amplitüdünü düşürür. Kalan lifler normal hızda iletir.`,
how:[`Uzunluğa bağımlı polinöropatide önce sural ve yüzeyel peroneal SNAP düşer, sonra el sinirleri.`,`Duyusal gangliyonopatide tutulum uzunluğa bağımlı değildir: kollarda da erken ve asimetrik düşüklük görülür.`],
pit:[`60 yaş üstünde sural SNAP'ın yokluğu tek başına anormal olmayabilir; yaşa göre normal değerlere bakın.`],
ddx:`Polinöropati (simetrik, uzunluğa bağımlı), mononöropati multipleks (asimetrik), gangliyonopati (Sjögren, paraneoplastik, sisplatin), pleksopati (segmental).`,
pearl:`Sural "normal, el SNAP'ları düşük" ise uzunluğa bağımlı aksonal polinöropati değildir; demiyelinizan süreç (sural koruma) ya da gangliyonopati düşünün.`,
q:[`Median, ulnar ve radial SNAP'lar çok düşük, sural ise normal. Aksonal polinöropati mi?`,`Uzunluğa bağımlı değil. AIDP'de sural koruma ya da duyusal gangliyonopati düşünülmeli.`]},
's:demy':{pf:`Demiyelinizasyonda duyusal lifler arasında iletim farkı artar. SNAP fazları kısa olduğu için bu farklılık fazların birbirini silmesine (faz iptali) yol açar; SNAP hem uzar hem küçülür.`,
how:[`Latans belirgin uzun, yanıt geniş ve basık.`,`Proksimalden uyarıldığında SNAP, BKAP'tan çok daha fazla küçülür.`],
pit:[`Faz iptali nedeniyle düşük SNAP akson kaybı sanılabilir; latans ve şekle bakın.`],
ddx:`AIDP (sural koruma), KİDP, CMT1, anti-MAG nöropati.`,
pearl:`AIDP'de median veya ulnar SNAP anormal ama sural normal: "sural koruma" erken tanıda değerlidir.`,
q:[`Neden demiyelinizasyonda SNAP, BKAP'tan daha çok küçülür?`,`SNAP fazları çok kısadır; küçük latans farkları bile pozitif ve negatif fazların birbirini silmesine yol açar. BKAP fazları daha uzun olduğu için daha az etkilenir.`]},
's:pregang':{pf:`Duyusal nöronun hücre gövdesi DRG'dedir ve periferik aksonu oradan uzanır. Lezyon DRG'nin proksimalindeyse (kök, avülsiyon, kord) periferik akson hücre gövdesine bağlı kalır ve dejenere olmaz; SNAP normal ölçülür.`,
how:[`İlgili dermatomda duyu kaybı ve normal SNAP birlikteyse lezyon preganglioniktir.`,`İğne EMG'de paraspinal ve kök dağılımına uyan kaslar değerlendirilir.`],
pit:[`L5 radikülopatisinde DRG bazen foramen içinde daha proksimaldedir; nadiren SNAP etkilenebilir.`],
ddx:`Pleksopati ve periferik sinir lezyonunda SNAP düşüktür.`,
pearl:`Travmatik brakiyal pleksus yaralanmasında normal SNAP ile tam duyu kaybı birlikteyse kök avülsiyonu düşünülür; bu durum cerrahi planı değiştirir.`,
q:[`Motosiklet kazası sonrası kolda tam duyu kaybı var ama median ve radial SNAP normal. Yorum?`,`Kök avülsiyonu (preganglionik lezyon); prognoz ve cerrahi seçenekler açısından önemlidir.`]},
'st:medS':{pf:`Duyusal lifler bası ve iskemiye motor liflerden daha duyarlıdır; bu yüzden KTS'de ilk anormal bulgu genellikle median SNAP'tır.`,
how:[`D2 veya D3'ten antidromik kayıt, 14 cm.`,`Karşılaştırma testleri: D4 halka (median–ulnar fark ≥0,5 ms), palmar mikst (≥0,4 ms), başparmak radial–median (≥0,5 ms), kombine duyusal indeks.`],
pearl:`Hafif KTS'de tek bir latans normal olabilir; karşılaştırma testleri aynı kişide iki siniri kıyasladığı için daha duyarlıdır.`,
q:[`Median SNAP tepe latansı 3,4 ms (normal), D4 median–ulnar farkı 0,8 ms. Yorum?`,`Hafif KTS ile uyumlu: karşılaştırma testi anormal.`]},
'st:ulnS':{pf:`Ulnar duyu lifleri DRG'den itibaren pleksus ve sinir boyunca seyreder; dirsek lezyonunda akson kaybıyla D5 SNAP düşer.`,
how:[`D5'ten antidromik kayıt, 11–14 cm.`,`Dorsal ulnar kutanöz SNAP: dirsek lezyonunda düşük, Guyon lezyonunda normal.`],
pearl:`Ulnar SNAP normal ama abductor digiti minimi ve birinci dorsal interosseöz tutulmuşsa C8 kökü veya Guyon kanalının derin dalı düşünülür.`,
q:[`El ulnar tarafında duyu kaybı var, D5 SNAP ve dorsal ulnar kutanöz SNAP düşük. Lezyon Guyon kanalında olabilir mi?`,`Büyük olasılıkla hayır: dorsal kutanöz dal Guyon kanalının proksimalinden ayrılır. Düşüklüğü dirsek veya daha proksimal bir lezyonu gösterir.`]},
'st:radS':{pf:`Yüzeyel radial sinir önkolun distal üçte birinde brakioradialisin altından çıkıp yüzeyelleşir ve el sırtının radial yarısını innerve eder; bilekte dış basıya çok açıktır.`,
how:[`G1 enfiye çukurunda, uyarı radiusun lateralinde 10 cm proksimalde.`],
ddx:`De Quervain tenosinoviti (iletim normal), C6 radikülopatisi (SNAP normal), lateral antebrakiyal kutanöz nöropati.`,
pearl:`Radial SNAP, C6 radikülopatisi ile pleksopatiyi ayırmada işe yarar.`,
q:[`Kelepçe takıldıktan sonra el sırtında uyuşma var, radial SNAP düşük. Tanı?`,`Yüzeyel radial nöropati (Wartenberg, "kelepçe nöropatisi").`]},
/* ---- F / H ---- */
'l:fN':{pf:`Distal uyarı motor aksonda iki yöne yayılır. Yukarı giden volley ön boynuza ulaşınca motor nöronların yalnızca %1–5'i aksonun başlangıç segmentinde yeniden ateşler ve aynı aksondan geri iner. Sinaps yoktur; F bir refleks değildir.`,
how:[`Supramaksimal uyarı, katot proksimalde; en az 10–20 tarama.`,`Minimum ve ortalama F latansı, kronodispersiyon (en uzun – en kısa) ve persistans ölçülür.`,`Beklenen F ≈ 2 × (uyarı–omurilik mesafesi) ÷ proksimal İH + distal motor latans + ~1 ms.`],
pit:[`İstemli kasılma F'leri kontamine eder; hasta tam gevşek olmalı.`,`A dalgası: sabit latans ve şekilde, F ile M arasında ya da F'den sonra görülen küçük yanıt; aksonal yeniden ateşleme veya kollateral dal kaynaklıdır, demiyelinizan ve aksonal nöropatilerde sıktır.`,`Boy uzadıkça F latansı uzar; normal değerler boya göre yorumlanmalıdır.`],
pearl:`Normal F, radikülopatiyi dışlamaz: kaslar birden fazla kökten innerve edilir ve tek kökün yavaşlaması uzun yol içinde seyrelir.`,
q:[`Distal iletim normal ama F min belirgin uzun ve persistans düşük. Akla ilk ne gelmeli?`,`Proksimal demiyelinizasyon: erken GBS'de ilk bozulan bulgu olabilir.`]},
'l:fD':{pf:`Demiyelinizasyon motor aksonun tüm uzunluğunda ileti hızını düşürür; F yanıtı bu yolu iki kez kat ettiği için yavaşlamayı büyütür. Bazı aksonlarda ileti bloğu olduğundan F'ler seyrekleşir.`,
how:[`F min, üst sınırın ~%120–150'sini aşar (kritere göre değişir).`,`Kronodispersiyon artar; bazı taramalarda F yoktur.`],
ddx:`Aksonal nöropatide F latansı ancak hız düşüşüyle orantılı uzar; orantısız uzama demiyelinizasyonu düşündürür.`,
pearl:`GBS'nin ilk günlerinde iletim çalışması normal olabilir; F kaybı ya da uzaması ve H yokluğu en erken bulgulardandır.`,
q:[`İlk haftada asendan güçsüzlük; distal latanslar normal, tüm F yanıtları alınamıyor. Ne düşünürsün?`,`Erken GBS (proksimal kök demiyelinizasyonu); çalışmayı 1–2 hafta sonra tekrarla.`]},
'l:fA':{pf:`Motor nöron havuzu küçüldüğünde geri ateşleyebilecek nöron sayısı da azalır. Kalan birkaç nöron tekrar tekrar yanıt verir; aynı latans ve şekildeki F'lere "tekrarlayıcı F" denir.`,
how:[`Persistans düşer; tekrarlayıcı F oranı artar.`],
pit:[`Peroneal sinirde sağlıklı kişide de persistans düşüktür; yorumlarken bunu hesaba katın.`],
ddx:`ALS, SMA, ağır aksonal nöropati, ağır akson kaybı.`,
pearl:`Spastisitede tersine F persistansı ve amplitüdü artabilir (üst motor nöron etkisi).`,
q:[`Normal latanslı ama %20 persistanslı, çok sayıda aynı şekilli F görülüyor. Yorum?`,`Motor nöron kaybı (ör. ALS): tekrarlayıcı F'ler ve düşük persistans.`]},
'l:hN':{pf:`Ia kas iğciği afferentleri en kalın ve en düşük eşikli liflerdir. Düşük şiddette yalnız onlar uyarılır; volley DRG ve arka kökten geçip ön boynuzdaki S1 motor nöronlarıyla monosinaptik bağlantı kurar. Yanıt soleustan kaydedilir.`,
how:[`Hasta yüzüstü, diz hafif bükülü; uzun süreli (0,5–1 ms) uyarı, katot proksimalde.`,`Akımı yavaş yavaş artırın: önce H, sonra M çıkar. H en büyük olduğunda (Hmax) latans ölçülür.`,`Taramalar en az 1–2 saniye arayla yapılır; daha sık uyarı H'yi küçültür.`,`Kolda fleksör karpi radialisten (C6–C7) da kaydedilebilir.`],
pit:[`60 yaş üstünde iki taraflı yokluğu tek başına anlamlı değildir.`,`Hafif kasılma H'yi büyütür (fasilitasyon); kas tam gevşek olmalı.`,`Normal latans boy, bacak uzunluğu ve yaşa göre değişir; tablolarla değerlendirilmelidir.`],
ddx:`F'den farkı: H düşük şiddette çıkar, latansı ve şekli sabittir, supramaksimal uyarıda kaybolur.`,
pearl:`H'de en duyarlı ölçüt iki taraf arasındaki latans farkıdır (>1,5 ms anlamlı).`,
q:[`Akım arttıkça önce büyüyen sonra kaybolan, latansı ve şekli sabit geç yanıt hangisidir?`,`H refleksi. Supramaksimal şiddette antidromik çarpışma nedeniyle kaybolur.`]},
'l:hS':{pf:`S1 kökü lezyonu refleks arkının hem afferent hem efferent kolunu DRG'nin proksimalinde etkiler. Monosinaptik yanıt gecikir, küçülür ya da kaybolur.`,
how:[`Latansı karşı tarafla karşılaştırın; fark >1,5 ms anlamlıdır.`,`Amplitüd asimetrisi (<%50) destekleyici bulgudur.`],
pit:[`Yalnızca S1 kökünü değerlendirir; L5 radikülopatide genellikle normaldir.`,`Bir kez kaybolan H refleksi klinik iyileşmeden sonra da geri gelmeyebilir; eski bir lezyonu yansıtabilir.`],
ddx:`Polinöropati (iki taraflı), proksimal tibial ya da siyatik nöropati, S1 radikülopatisi.`,
pearl:`Sural SNAP normal + H refleksi anormal + gastroknemius ve paraspinal denervasyon = S1 radikülopatisi.`,
q:[`H refleksi iki taraflı yok, sural SNAP da iki taraflı yok. S1 radikülopatisi mi?`,`Büyük olasılıkla polinöropati: sural SNAP'ın da düşük olması lezyonun DRG'nin distalinde olduğunu gösterir.`]}};
const NANAT={
medM:`Median sinir C6–T1 köklerinden, lateral ve medial kordlardan oluşur. Kolda brakiyal arterle birlikte iner, dirsekte pronator teresin başları arasından geçer ve önkolda anterior interosseöz dalını verir. Bilekte karpal tünelden geçip tenar motor dalı (abductor pollicis brevis, opponens pollicis, fleksör pollicis brevisin yüzeyel başı) ve ilk 3,5 parmağın palmar duyusunu verir. Palmar kutanöz dal tünelin üstünden geçer.`,
medS:`Median sinir C6–T1 köklerinden oluşur; bilekte karpal tünelden geçer ve ilk 3,5 parmağın palmar duyusunu verir. Palmar kutanöz dal tünelin üstünden geçtiği için KTS'de avuç içi duyusu korunur.`,
ulnM:`Ulnar sinir C8–T1 köklerinden, medial korddan çıkar. Dirsekte medial epikondilin arkasında (retrokondiler oluk) ve fleksör karpi ulnaris aponörozu altında (kubital tünel) seyreder; önkolda fleksör karpi ulnarisi ve fleksör digitorum profundusun 4–5. parmak bölümünü innerve eder. Bileğin proksimalinde dorsal kutanöz dalını verir, sonra Guyon kanalından geçerek hipotenar kasları, interosseleri ve adduktor pollisisi innerve eder.`,
ulnS:`Ulnar sinir C8–T1 köklerinden çıkar; 5. parmağın ve 4. parmağın ulnar yarısının duyusunu verir. Dorsal kutanöz dal bileğin ~5–8 cm proksimalinden ayrılır.`,
radS:`Radial sinir C5–T1 köklerinden, posterior korddan çıkar ve humerusun spiral oluğunda seyreder. Dirsekte posterior interosseöz sinir ve yüzeyel dal olarak ikiye ayrılır; yüzeyel dal önkolun distalinde yüzeyelleşerek el sırtının radial yarısını innerve eder.`,
perM:`Peroneal (fibular) sinir L4–S1 köklerinden, siyatiğin lateral bölümünden gelir. Popliteal fossayı geçip fibula başının etrafında döner; burası en sık bası yeridir. Derin dal tibialis anterior, ekstansör hallucis longus, ekstansör digitorum longus ve ekstansör digitorum brevisi, yüzeyel dal ise peroneus longus ile brevisi ve ayak sırtı duyusunu verir.`,
tibM:`Tibial sinir L4–S3 köklerinden, siyatiğin medial bölümünden gelir. Popliteal fossadan iner; gastroknemius, soleus ve tibialis posterioru innerve eder. Medial malleolün arkasında tarsal tünelden geçerek medial ve lateral plantar sinirlere ayrılır.`,
surS:`Sural sinir tibial sinirin medial kutanöz dalı ile peroneal sinirin iletişim dalının birleşmesinden oluşur. Baldırın arkasından lateral malleolün arkasına iner ve ayağın lateral kenarının duyusunu verir. Lifleri çoğunlukla S1 kökündendir; sinir biyopsisi için en sık kullanılan sinirdir.`,
spS:`Yüzeyel peroneal sinir bacağın alt üçte birinde fasyayı delerek yüzeyelleşir ve ayak sırtının duyusunu verir; lifleri çoğunlukla L5 kökündendir. L5 radikülopatisinde normal, peroneal nöropatide düşüktür.`};
const PGUIDE={how:[`<b>1.</b> Önce amplitüdlere bakın: düşük amplitüd akson kaybını, uzun latans ve düşük hız miyelin hasarını gösterir.`,`<b>2.</b> Duyu mu, motor mu, ikisi mi? Yalnız motor tutulum ön boynuz veya motor nöropatiyi; yalnız duyu tutulumu gangliyonopatiyi düşündürür.`,`<b>3.</b> Yaygın mı, fokal mı? Bir sinirde, bir segmentte sınırlı bulgu tuzak nöropatiyi düşündürür; iki sinirin aynı segmentini ve karşı tarafı karşılaştırın.`,`<b>4.</b> Uzunluğa bağımlı mı? Önce bacak, sonra kol tutuluyorsa aksonal polinöropati olasıdır.`,`<b>5.</b> Duyu kaybı var ama SNAP normal mi? Lezyon DRG'nin proksimalindedir (kök).`,`<b>6.</b> F ve H, proksimal segmentler ve kök hakkında ek bilgi verir.`],
pit:[`Polinöropati şüphesinde en az bir bacakta sural ve peroneal veya tibial motor, bir kolda median ve ulnar çalışın; tek bir sinirden genelleme yapmayın.`,`Submaksimal uyarı, yanlış elektrot yeri ve soğuk ekstremite en sık yanıltan teknik hatalardır.`],
pearl:`Demiyelinizan aralık kabaca şöyledir: İH alt sınırın %70–75'inin altında, distal latans üst sınırın %130'unun üstünde, F latansı üst sınırın %120–130'unun üstünde. Kesin eşikler kullanılan kritere göre değişir.`};

<h3>Bileşenler</h3>
<table class="dt"><tr><th>Yöntem</th><th>Neyi ölçer</th><th>En güçlü olduğu soru</th></tr>
<tr><td>Motor sinir iletimi</td><td>BKAP: motor akson + kavşak + kas lifinin toplam yanıtı</td><td>Akson kaybı mı, demiyelinizasyon mu; fokal yavaşlama ve blok</td></tr>
<tr><td>Duyu sinir iletimi</td><td>SNAP: DRG'den çıkan kalın miyelinli duyu aksonları</td><td>Lezyon DRG'nin proksimalinde mi distalinde mi</td></tr>
<tr><td>Geç yanıtlar (F, H)</td><td>Proksimal segment ve kökler</td><td>Erken GBS, proksimal demiyelinizasyon, S1 kökü</td></tr>
<tr><td>Tekrarlayıcı uyarı, tek lif EMG</td><td>Kavşak güvenlik faktörü</td><td>Miyasteni, LEMS, botulizm</td></tr>
<tr><td>İğne EMG</td><td>Kasın istirahat ve istemli aktivitesi</td><td>Denervasyon, reinnervasyon, miyopati; zamanlama</td></tr></table>
<h3>Endikasyonlar</h3>
<ul><li>Fokal güçsüzlük, uyuşma, ağrı: tuzak nöropatiler, radikülopati, pleksopati.</li>
<li>Yaygın güçsüzlük: motor nöron hastalığı, polinöropati, kavşak hastalığı, miyopati ayrımı.</li>
<li>Travma sonrası: sinir hasarının tipi ve prognozu, cerrahi zamanlaması.</li>
<li>Takip: CIDP, MMN tedavi yanıtı; reinnervasyonun izlenmesi.</li>
<li>Kas biyopsisi yerinin seçilmesi (iğnelenen kasın karşı tarafındaki homolog kas).</li></ul>
<h3>Planlama: "her hastaya aynı protokol" yoktur</h3>
<p>İnceleme, ön tanıya göre başlar ama bulgulara göre <b>yön değiştirir</b>. Örneğin karpal tünel ön tanısıyla gelen bir hastada ulnar duyu da düşükse polinöropati, ipsilateral medial antebrakiyal kutanöz SNAP düşükse alt trunkus düşünülür ve plan genişletilir. Her bulgu bir hipotezi test etmelidir.</p>
${BX('def','Altın kurallar','1) Önce sinir iletimi, sonra iğne EMG. 2) Anormal bir bulguyu karşı tarafla ve komşu sinirle karşılaştırın. 3) Tek sınırda değere dayanarak tanı koymayın. 4) Ekstremite ısısını ölçün. 5) Bulgu klinikle uyuşmuyorsa önce teknik hatayı arayın.')}
<h3>EMG'nin sınırları</h3>
<ul><li><b>Küçük lif</b> (Aδ, C) fonksiyonunu ölçmez; küçük lif nöropatisinde rutin EMG normaldir.</li>
<li>Saf duyu kök lezyonu (DRG proksimali) ve saf demiyelinizan kök lezyonu iğne EMG'de iz bırakmayabilir: <b>normal EMG radikülopatiyi dışlamaz</b>.</li>
<li>Hiperakut dönemde (ilk 7–10 gün) akson kaybı henüz görünmez; zamanlama yanlışsa sonuç yanıltır.</li>
<li>Santral (üst motor nöron) lezyonlar ancak dolaylı bulgu verir (azalmış aktivasyon).</li></ul>
${BX('clin','Klinik ipucu','İstek formuna "EMG" yazmak yetmez. Klinik soru açık olmalı: "Sağ elde uyuşma: KTS mi, C6–7 mi?" Soru ne kadar netse inceleme o kadar hedefli ve kısa olur.')}`},

{id:'fizyo',p:'I',t:'Membran fizyolojisi, miyelin ve lif tipleri',lv:'Temel',h:()=>`
<p class="lead">Sinir iletimi çalışmalarında gördüğümüz her dalga, binlerce aksiyon potansiyelinin (AP) uzaktan, cilt üzerinden kaydedilmiş toplamıdır. Bu toplamı doğru yorumlamak için tek bir aksonda ne olduğunu iyi bilmek gerekir.</p>
<h3>İstirahat potansiyeli ve aksiyon potansiyeli</h3>
<p>Na⁺/K⁺-ATPaz pompası ve istirahatte açık K⁺ kanalları zar içini negatif tutar: aksonda yaklaşık −70 mV, kas lifinde yaklaşık −85 ile −90 mV. Zar eşiğe (yaklaşık −55 mV) kadar depolarize olursa <b>voltaj kapılı Na⁺ kanalları</b> açılır, içeri Na⁺ akımı zarı +30 mV'a çıkarır. Ardından Na⁺ kanalları inaktive olur, K⁺ kanalları açılır ve zar repolarize olur. Na⁺ kanallarının inaktivasyondan çıkması için gereken süre <b>refrakter dönemi</b> belirler (mutlak ~0,5–1 ms, rölatif birkaç ms). Bu nedenle AP'ler tek yönlü yayılır ve yüksek frekansta ard arda uyarılarda ikinci yanıt küçülebilir.</p>
<h3>Miyelin ve saltatorik iletim</h3>
${DF('salt','Şekil 2 · Miyelinli aksonda Na⁺ kanalları Ranvier düğümlerinde yoğunlaşır (Nav1.6); internod boyunca miyelin kapasitansı düşürür ve akım kaçağını engeller. AP düğümden düğüme "atlar".')}
<p>Miyelin, Schwann hücresinin akson etrafına sardığı çok katlı yağlı zardır. İki etkisi vardır: zar <b>kapasitansını</b> azaltır (daha az yük ile depolarize olur) ve <b>direnci</b> artırır (akım kaçağını engeller). Böylece akım internod boyunca pasif ve hızla ilerler, bir sonraki düğümü eşiğe getirir. Düğümler arası mesafe kabaca akson çapının 100 katıdır. Paranodal bölgede miyelin aksona sıkıca tutunur, jukstaparanodal bölgede Kv1 kanalları bulunur. Bu yapı bozulduğunda (örneğin nodo-paranodopatilerde anti-nörofasin 155, anti-kontaktin-1) ileti düğüm düzeyinde aksar.</p>
${BX('def','Güvenlik faktörü','Bir düğümde üretilen akımın bir sonraki düğümü eşiğe getirmek için gereken akıma oranıdır; normalde 5–7 kat. Demiyelinizasyonda akım kaçar ve kapasitans artar; güvenlik faktörü önce düşer (ileti <b>yavaşlar</b>), 1\'in altına inerse ileti o noktada <b>durur</b> (ileti bloğu). Isı artışı Na⁺ kanalı inaktivasyonunu hızlandırdığı için sınırda lifleri bloğa iter: Uhthoff fenomeninin periferik karşılığı.')}
<h3>Çap–hız ilişkisi ve lif sınıfları</h3>
<p>Miyelinli liflerde iletim hızı (m/s) yaklaşık olarak lif çapının (µm) <b>6 katıdır</b> (Hursh). Rutin sinir iletimi yalnızca <b>en kalın ve en hızlı</b> lifleri ölçer: latans ve hız ilk gelen liflerden hesaplanır, amplitüd ise kalın liflerin sayısını yansıtır.</p>
<table class="dt"><tr><th>Sınıf (Erlanger–Gasser / Lloyd–Hunt)</th><th>Çap</th><th>Hız</th><th>İşlev</th><th>Rutin SİÇ'de</th></tr>
<tr><td>Aα / Ia, Ib</td><td>12–20 µm</td><td>70–120 m/s</td><td>Kas iğciği, Golgi tendon organı; alfa motor akson</td><td>Evet (BKAP, H refleksi)</td></tr>
<tr><td>Aβ / II</td><td>6–12 µm</td><td>35–75 m/s</td><td>Dokunma, titreşim, pozisyon</td><td>Evet (SNAP)</td></tr>
<tr><td>Aγ</td><td>3–6 µm</td><td>15–30 m/s</td><td>İğcik içi (fuziform) motor</td><td>Hayır</td></tr>
<tr><td>Aδ / III</td><td>1–5 µm</td><td>5–30 m/s</td><td>Keskin ağrı, soğuk</td><td>Hayır</td></tr>
<tr><td>B</td><td>&lt;3 µm</td><td>3–15 m/s</td><td>Preganglionik otonom</td><td>Hayır</td></tr>
<tr><td>C / IV (miyelinsiz)</td><td>0,2–1,5 µm</td><td>0,5–2 m/s</td><td>Yanıcı ağrı, sıcak, postganglionik otonom</td><td>Hayır (SSR, QSART, deri biyopsisi)</td></tr></table>
${BX('pearl','Akılda kalsın','İletim hızı en hızlı birkaç lifin hızıdır. Kalın liflerin %70–80\'i kaybolsa bile kalan tek bir hızlı lif hızı normal tutabilir. Bu yüzden akson kaybı esas olarak <b>amplitüdü</b>, demiyelinizasyon esas olarak <b>latans ve hızı</b> etkiler.')}
<h3>Demiyelinizasyonun sonuçları</h3>
<ul><li><b>Yavaşlama:</b> İnternodda zayıflayan akım düğümü daha geç eşiğe getirir; segmental demiyelinizasyonda ileti düğüm atlamak yerine sürekli (kontinü) hale gelebilir.</li>
<li><b>İleti bloğu:</b> Güvenlik faktörü 1'in altında; distal uyarıda yanıt normal, lezyonun proksimalinden uyarıda küçük.</li>
<li><b>Temporal dispersiyon:</b> Liflerin farklı derecede yavaşlaması yanıtı yayar.</li>
<li><b>Frekans bağımlı blok:</b> Yüksek frekansta ard arda impulslar geçemez (dayanıklılık düşer, yorgunluk).</li>
<li><b>Ektopik ateşleme ve efaptik geçiş:</b> Miyokimi, nöromiyotoni, parestezi.</li></ul>`},

{id:'mu',p:'I',t:'Motor ünite',lv:'Temel',h:()=>`
<p class="lead">Motor ünite (MÜ), bir alfa motor nöron, aksonu ve bu aksonun innerve ettiği tüm kas lifleridir. İğne EMG'de gördüğümüz her MUP bir motor ünitenin, BKAP ise uyarılan tüm motor ünitelerin toplamıdır.</p>
${DF('mu','Şekil 3 · İki motor ünite. Liflerin kas içinde mozaik (dama tahtası) dağılımı vardır: aynı ünitenin lifleri yan yana değil, başka ünitelerin lifleri arasına serpiştirilmiştir.')}
<h3>İnnervasyon oranı ve ünite alanı</h3>
<p>Bir motor nöronun innerve ettiği lif sayısı kastan kasa çok değişir: dış göz kaslarında 5–10, el intrinsik kaslarında 100–300, gastroknemius ve tibialis anteriorda 1000–2000. Bir ünitenin lifleri kas kesitinde 5–10 mm çaplı bir alana dağılır ve bu alanda 20–30 farklı ünitenin lifleri iç içe geçer. Bu mozaik yapı, iğne ucunun yakınında aynı üniteden normalde yalnızca 1–2 lif bulunmasını sağlar (normal <b>lif yoğunluğu</b> ~1,5).</p>
<h3>Ünite tipleri ve boyut ilkesi</h3>
<table class="dt"><tr><th></th><th>Tip I (S, yavaş)</th><th>Tip IIA (FR)</th><th>Tip IIB/X (FF)</th></tr>
<tr><td>Motor nöron</td><td>Küçük, düşük eşikli</td><td>Orta</td><td>Büyük, yüksek eşikli</td></tr>
<tr><td>Lif sayısı / kuvvet</td><td>Az / düşük</td><td>Orta</td><td>Çok / yüksek</td></tr>
<tr><td>Yorgunluk</td><td>Dirençli</td><td>Dirençli</td><td>Çabuk yorulur</td></tr>
<tr><td>Metabolizma</td><td>Oksidatif</td><td>Oksidatif-glikolitik</td><td>Glikolitik</td></tr></table>
<p><b>Henneman boyut ilkesi:</b> Kasılma arttıkça önce küçük, düşük eşikli üniteler, sonra giderek daha büyük üniteler devreye girer. Bu yüzden iğne EMG'de minimal kasılmada gördüğümüz MUP'lar küçük tip I ünitelerdir; MUP analizi bu düşük eşikli ünitelerle yapılır. Kuvvet iki yolla artar: yeni ünite katılması (<b>rekrutman</b>) ve mevcut ünitelerin ateşleme hızını artırması (<b>hız kodlaması</b>).</p>
<h3>Hastalıkta motor ünite</h3>
<ul><li><b>Nörojenik süreç:</b> Ünite sayısı azalır. Sağ kalan aksonlar denerve lifleri <b>kollateral filizlenme</b> ile sahiplenir: ünite büyür, lifleri gruplaşır (biyopside "fiber type grouping"), MUP uzun süreli ve yüksek amplitüdlü olur.</li>
<li><b>Miyopatik süreç:</b> Ünite sayısı aynıdır ama her ünitenin çalışan lif sayısı azalır: MUP kısa süreli, düşük amplitüdlü ve polifazik olur; aynı kuvvet için daha çok ünite gerekir (erken rekrutman).</li>
<li><b>Kavşak hastalığı:</b> Ünite sayısı ve büyüklüğü normaldir ama bazı liflerde ileti aralıklı olarak başarısız olur: MUP her ateşlemede değişir (instabilite).</li></ul>`},

{id:'hacim',p:'I',t:'Hacim iletimi: dalga şekli nereden gelir?',lv:'Orta',h:()=>`
<p class="lead">Elektrotlarımız sinire ya da kas lifine dokunmaz; aradaki doku (hacim iletkeni) içinden yayılan akımı kaydeder. Bir dalganın neden başta pozitif ya da negatif olduğunu, neden trifazik göründüğünü bilmek, elektrot yerinin doğru olup olmadığını ve dalganın nereden geldiğini anlamanın temelidir.</p>
